<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="description" content="Turn weekly and monthly chores into a game: earn XP, keep your streak alive, unlock badges and level up every time you clean.">
  <meta property="og:title" content="Chorequest — Level up your household chores">
  <meta property="og:description" content="Turn weekly and monthly chores into a game: earn XP, keep your streak alive, unlock badges and level up every time you clean.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <!-- ===== PWA ===== -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#40a88b" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c2a2a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Chorequest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --radius: 1rem;
      --background: oklch(0.985 0.012 95);
      --foreground: oklch(0.24 0.03 165);
      --card: oklch(1 0 0);
      --card-foreground: oklch(0.24 0.03 165);
      --primary: oklch(0.62 0.13 172);
      --primary-foreground: oklch(0.99 0.01 170);
      --secondary: oklch(0.95 0.02 170);
      --secondary-foreground: oklch(0.32 0.05 170);
      --muted: oklch(0.955 0.012 120);
      --muted-foreground: oklch(0.53 0.02 170);
      --accent: oklch(0.8 0.15 78);
      --accent-foreground: oklch(0.28 0.06 60);
      --destructive: oklch(0.6 0.19 25);
      --destructive-foreground: oklch(0.99 0 0);
      --border: oklch(0.9 0.015 160);
      --input: oklch(0.92 0.012 160);
      --ring: oklch(0.62 0.13 172);
      --xp: oklch(0.62 0.13 172);
      --streak: oklch(0.7 0.17 45);
      --badge: oklch(0.65 0.15 300);
      --freeze: oklch(0.72 0.12 230);
      --positive: oklch(0.65 0.15 155);
      --negative: oklch(0.6 0.18 25);
      --easy: oklch(0.68 0.13 160);
      --medium: oklch(0.76 0.15 80);
      --hard: oklch(0.63 0.17 25);
      --shadow-soft: 0 1px 2px oklch(0.3 0.03 170 / 0.06), 0 6px 16px oklch(0.3 0.03 170 / 0.06);
      --shadow-lift: 0 10px 30px oklch(0.3 0.03 170 / 0.14);
      --shadow-sheet: 0 -20px 60px oklch(0 0 0 / 0.25);
      --font-display: "Space Grotesk", ui-sans-serif, sans-serif;
      --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
    }
    html.dark {
      --background: oklch(0.19 0.02 175);
      --foreground: oklch(0.96 0.01 160);
      --card: oklch(0.235 0.022 175);
      --card-foreground: oklch(0.96 0.01 160);
      --primary: oklch(0.75 0.14 172);
      --primary-foreground: oklch(0.2 0.03 175);
      --secondary: oklch(0.29 0.025 175);
      --secondary-foreground: oklch(0.94 0.01 160);
      --muted: oklch(0.28 0.02 175);
      --muted-foreground: oklch(0.72 0.02 165);
      --accent: oklch(0.82 0.15 78);
      --accent-foreground: oklch(0.24 0.05 60);
      --destructive: oklch(0.66 0.18 25);
      --destructive-foreground: oklch(0.98 0 0);
      --border: oklch(1 0 0 / 10%);
      --input: oklch(1 0 0 / 14%);
      --ring: oklch(0.75 0.14 172);
      --xp: oklch(0.78 0.14 172);
      --streak: oklch(0.78 0.16 55);
      --badge: oklch(0.78 0.14 300);
      --freeze: oklch(0.8 0.13 230);
      --positive: oklch(0.78 0.14 155);
      --negative: oklch(0.72 0.17 25);
      --easy: oklch(0.75 0.13 160);
      --medium: oklch(0.82 0.14 85);
      --hard: oklch(0.7 0.16 25);
      --shadow-soft: 0 1px 2px oklch(0 0 0 / 0.3), 0 6px 16px oklch(0 0 0 / 0.28);
      --shadow-lift: 0 12px 34px oklch(0 0 0 / 0.45);
      --shadow-sheet: 0 -20px 60px oklch(0 0 0 / 0.6);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    body.sheet-open { overflow: hidden; }
    h1, h2, h3 { font-family: var(--font-display); letter-spacing: -0.02em; margin: 0; }
    p { margin: 0; }
    button { font: inherit; }
    input, select { font: inherit; color: inherit; }
    svg { display: block; }

    .app { max-width: 460px; margin: 0 auto; padding: 20px 16px 60px; }

    /* Header */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; gap: 8px;
    }
    .brand { min-width: 0; }
    .brand h1 { font-size: 1.2rem; font-weight: 800; }
    .brand p { font-size: 0.72rem; color: var(--muted-foreground); }
    .header-actions { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .icon-btn {
      width: 36px; height: 36px;
      display: grid; place-items: center;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted-foreground);
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
      position: relative;
      padding: 0;
    }
    .icon-btn:hover { color: var(--foreground); }
    .icon-btn > svg, .icon-btn > i { width: 15px; height: 15px; }
    .icon-btn.notif-on { border-color: var(--primary); color: var(--primary); }
    .icon-btn.notif-off { opacity: 0.6; }
    .icon-btn.shop-btn {
      border-color: color-mix(in oklch, var(--xp) 40%, var(--border));
      color: var(--xp);
    }
    .icon-btn.shop-btn:hover { background: color-mix(in oklch, var(--xp) 10%, var(--card)); }
    .coin-badge {
      position: absolute; top: -5px; right: -5px;
      min-width: 18px; height: 18px; padding: 0 4px;
      border-radius: 999px;
      background: var(--xp);
      color: var(--background);
      font-family: var(--font-display);
      font-size: 9px; font-weight: 800;
      display: grid; place-items: center;
      border: 2px solid var(--background);
      line-height: 1; letter-spacing: -0.02em;
    }
    html.dark .coin-badge { color: oklch(0.2 0.03 175); }
    @media (max-width: 420px) {
      .icon-btn { width: 34px; height: 34px; }
      .icon-btn > svg, .icon-btn > i { width: 14px; height: 14px; }
      .brand h1 { font-size: 1.1rem; }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      box-shadow: var(--shadow-soft);
    }

    /* Level card */
    .level-card { padding: 20px; animation: rise 0.45s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .level-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
    .level-label {
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--primary);
    }
    .level-number {
      font-family: var(--font-display);
      font-size: 3.75rem; font-weight: 800; line-height: 1; margin-top: 4px;
      animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .level-total { text-align: right; }
    .level-total .xp-total { font-family: var(--font-display); font-size: 0.875rem; font-weight: 700; color: var(--xp); }
    .level-total .xp-next { font-size: 0.75rem; color: var(--muted-foreground); }
    .xp-bar { margin-top: 16px; height: 12px; border-radius: 999px; background: var(--muted); overflow: hidden; }
    .xp-bar-fill { height: 100%; border-radius: 999px; background: var(--primary); transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1); }
    .xp-caption { margin-top: 6px; font-size: 11px; color: var(--muted-foreground); }

    .ring-block {
      margin-top: 16px; display: flex; align-items: center; gap: 12px;
      background: color-mix(in oklch, var(--muted) 60%, transparent);
      border-radius: 1rem; padding: 12px;
    }
    .ring-wrap { position: relative; width: 64px; height: 64px; flex-shrink: 0; }
    .ring-wrap svg { width: 64px; height: 64px; transform: rotate(-90deg); }
    .ring-value { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 0.875rem; }
    .ring-text .ring-title { font-family: var(--font-display); font-weight: 700; font-size: 0.875rem; }
    .ring-text .ring-caption { font-size: 0.75rem; color: var(--muted-foreground); }

    /* Dashboard quick stats */
    .dash-stats {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .dash-stat {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-radius: 1rem;
      background: color-mix(in oklch, var(--muted) 55%, transparent);
      transition: transform 0.2s, background 0.2s;
      text-align: left;
      border: 0;
      width: 100%;
      color: inherit;
      font: inherit;
    }
    .dash-stat.clickable { cursor: pointer; }
    .dash-stat.clickable:hover { background: color-mix(in oklch, var(--badge) 10%, var(--muted) 55%); }
    .dash-stat.clickable:active { transform: scale(0.98); }
    .dash-stat-icon {
      width: 34px; height: 34px;
      display: grid; place-items: center;
      border-radius: 999px;
      flex-shrink: 0;
    }
    .dash-stat-icon svg { width: 17px; height: 17px; }
    .dash-stat.streak .dash-stat-icon { background: color-mix(in oklch, var(--streak) 18%, transparent); color: var(--streak); }
    .dash-stat.badges .dash-stat-icon { background: color-mix(in oklch, var(--badge) 18%, transparent); color: var(--badge); }
    .dash-stat-info { min-width: 0; flex: 1; }
    .dash-stat-value {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 800;
      line-height: 1;
      display: flex;
      align-items: baseline;
      gap: 2px;
    }
    .dash-stat-value .unit {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--muted-foreground);
      margin-left: 3px;
    }
    .dash-stat-label {
      margin-top: 2px;
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted-foreground);
    }
    .dash-stat-extra {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      margin-left: auto;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--freeze);
    }
    .dash-stat-extra svg { width: 11px; height: 11px; }
    .dash-badge-progress {
      margin-top: 6px;
      height: 3px;
      border-radius: 999px;
      background: color-mix(in oklch, var(--badge) 20%, var(--muted));
      overflow: hidden;
    }
    .dash-badge-progress-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--badge);
      transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Weekly recap card */
    .week-card {
      margin-top: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: color-mix(in oklch, var(--primary) 6%, var(--card));
      border: 1px solid color-mix(in oklch, var(--primary) 20%, var(--border));
      border-radius: 1.25rem;
      box-shadow: var(--shadow-soft);
      animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 0.05s;
    }
    .week-icon {
      width: 42px; height: 42px; flex-shrink: 0;
      display: grid; place-items: center;
      border-radius: 999px;
      background: color-mix(in oklch, var(--primary) 15%, transparent);
      color: var(--primary);
    }
    .week-icon svg { width: 20px; height: 20px; }
    .week-content { min-width: 0; flex: 1; }
    .week-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted-foreground);
    }
    .week-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .week-main {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 800;
      line-height: 1;
      color: var(--foreground);
    }
    .week-main .unit {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted-foreground);
      margin-left: 2px;
    }
    .week-trend {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      background: color-mix(in oklch, var(--positive) 15%, transparent);
      color: var(--positive);
    }
    .week-trend.negative {
      background: color-mix(in oklch, var(--negative) 15%, transparent);
      color: var(--negative);
    }
    .week-trend svg { width: 11px; height: 11px; }
    .week-sub {
      font-size: 0.72rem;
      color: var(--muted-foreground);
      margin-top: 3px;
    }
    .week-sub strong {
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--foreground);
    }

    .section { margin-top: 24px; }
    .section-title { font-family: var(--font-display); font-weight: 700; font-size: 1rem; margin-bottom: 12px; }

    /* Tabs + filters */
    .tabs-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
    .tabs { display: flex; gap: 4px; padding: 4px; background: var(--muted); border-radius: 999px; }
    .tab {
      border: 0; background: transparent;
      padding: 4px 12px; border-radius: 999px;
      font-size: 0.75rem; font-weight: 700;
      color: var(--muted-foreground);
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
    }
    .tab:hover { color: var(--foreground); }
    .tab.active { background: var(--card); color: var(--foreground); box-shadow: 0 1px 2px oklch(0 0 0 / 0.06); }
    .chores-summary { font-size: 0.75rem; color: var(--muted-foreground); }

    .filter-row {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted-foreground);
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-chip:hover { color: var(--foreground); border-color: color-mix(in oklch, var(--primary) 30%, var(--border)); }
    .filter-chip.active {
      background: var(--primary);
      color: var(--primary-foreground);
      border-color: var(--primary);
    }
    .filter-chip .filter-count {
      display: inline-block;
      padding: 0 5px;
      border-radius: 999px;
      background: color-mix(in oklch, currentColor 15%, transparent);
      font-size: 0.65rem;
      font-weight: 800;
      min-width: 16px;
      text-align: center;
    }
    .filter-chip.active .filter-count {
      background: color-mix(in oklch, var(--primary-foreground) 25%, transparent);
    }

    /* Chore list */
    .chore-groups { display: flex; flex-direction: column; gap: 4px; }
    .category-title {
      display: flex; align-items: center; gap: 7px;
      font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--muted-foreground);
      margin: 16px 0 8px;
    }
    .category-title:first-child { margin-top: 0; }
    .category-title .cat-icon {
      width: 13px; height: 13px;
      color: var(--primary);
      stroke-width: 2.5;
      flex-shrink: 0;
    }
    .chore-list { display: flex; flex-direction: column; gap: 10px; }

    .chore-card {
      position: relative;
      display: flex; align-items: center; gap: 12px;
      padding: 14px;
      border-radius: 1.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
      transition: opacity 0.3s;
      animation: rise 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .chore-card.done { opacity: 0.6; }
    .chore-main { min-width: 0; flex: 1; }
    .chore-name {
      font-family: var(--font-display);
      font-size: 15px; font-weight: 700; line-height: 1.2;
      display: flex; align-items: center; gap: 8px;
    }
    .chore-name .chore-name-icon {
      width: 15px; height: 15px;
      color: var(--muted-foreground);
      stroke-width: 2;
      flex-shrink: 0;
    }
    .chore-card.done .chore-name { color: var(--muted-foreground); text-decoration: line-through; }
    .chore-card.done .chore-name .chore-name-icon { color: var(--muted-foreground); opacity: 0.7; }
    .chore-tags { margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 11px; }
    .chip {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-weight: 500;
      background: var(--secondary);
      color: var(--secondary-foreground);
    }
    .chip.difficulty { font-weight: 600; text-transform: capitalize; }
    .chip.easy { background: color-mix(in oklch, var(--easy) 15%, transparent); color: var(--easy); }
    .chip.medium { background: color-mix(in oklch, var(--medium) 20%, transparent); color: var(--medium); }
    .chip.hard { background: color-mix(in oklch, var(--hard) 15%, transparent); color: var(--hard); }
    .chore-actions { position: relative; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .chore-xp { font-family: var(--font-display); font-weight: 700; font-size: 0.875rem; color: var(--xp); }
    .chore-btn {
      width: 40px; height: 40px;
      display: grid; place-items: center;
      border-radius: 0.75rem;
      border: 2px solid var(--border);
      background: transparent;
      color: var(--muted-foreground);
      cursor: pointer;
      transition: all 0.2s;
    }
    .chore-btn:hover { border-color: var(--primary); background: var(--primary); color: var(--primary-foreground); }
    .chore-btn:active { transform: scale(0.9); }
    .chore-btn svg { width: 20px; height: 20px; }
    .chore-btn.ghost { border-color: transparent; border-width: 0; }
    .chore-btn.ghost:hover { background: var(--muted); color: var(--foreground); }
    .chore-btn.ghost.undo-hover:hover { background: color-mix(in oklch, var(--primary) 15%, transparent); color: var(--primary); }
    .chore-btn.delete-hover:hover { background: color-mix(in oklch, var(--destructive) 15%, transparent); color: var(--destructive); }

    .xp-float {
      position: absolute; top: -24px; right: 0;
      pointer-events: none;
      font-family: var(--font-display);
      font-weight: 700; font-size: 0.875rem;
      color: var(--xp);
      animation: xp-float 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .xp-float.negative { color: var(--negative); }

    /* ===== Badge chains ===== */
    .chain-list { display: flex; flex-direction: column; gap: 10px; }
    .badge-chain {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      box-shadow: var(--shadow-soft);
      padding: 14px;
      transition: opacity 0.2s;
    }
    .badge-chain.locked { opacity: 0.85; }
    .chain-head {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chain-icon {
      width: 42px; height: 42px;
      display: grid; place-items: center;
      border-radius: 999px;
      flex-shrink: 0;
      background: color-mix(in oklch, var(--badge) 15%, transparent);
      color: var(--badge);
    }
    .chain-icon svg { width: 20px; height: 20px; }
    .badge-chain[data-chain="streak"] .chain-icon {
      background: color-mix(in oklch, var(--streak) 18%, transparent);
      color: var(--streak);
    }
    .badge-chain[data-chain="level"] .chain-icon {
      background: color-mix(in oklch, var(--accent) 20%, transparent);
      color: var(--accent-foreground);
    }
    .badge-chain[data-chain="xp"] .chain-icon {
      background: color-mix(in oklch, var(--xp) 15%, transparent);
      color: var(--xp);
    }
    .badge-chain[data-chain="reward"] .chain-icon {
      background: color-mix(in oklch, var(--positive) 18%, transparent);
      color: var(--positive);
    }
    .chain-info { min-width: 0; flex: 1; }
    .chain-name {
      font-family: var(--font-display);
      font-size: 0.9375rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .chain-sub {
      margin-top: 3px;
      font-size: 0.72rem;
      color: var(--muted-foreground);
      line-height: 1.3;
    }
    .chain-sub strong { color: var(--foreground); font-weight: 700; }
    .chain-count {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      background: color-mix(in oklch, var(--badge) 15%, transparent);
      color: var(--badge);
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 0.75rem;
    }
    .badge-chain.maxed .chain-count {
      background: color-mix(in oklch, var(--positive) 18%, transparent);
      color: var(--positive);
    }

    .chain-bar {
      margin-top: 12px;
      height: 6px;
      border-radius: 999px;
      background: var(--muted);
      overflow: hidden;
    }
    .chain-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--badge), color-mix(in oklch, var(--badge) 60%, var(--accent)));
      transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .badge-chain[data-chain="streak"] .chain-fill {
      background: linear-gradient(90deg, var(--streak), color-mix(in oklch, var(--streak) 60%, var(--accent)));
    }
    .badge-chain[data-chain="level"] .chain-fill {
      background: linear-gradient(90deg, var(--accent), color-mix(in oklch, var(--accent) 60%, var(--primary)));
    }
    .badge-chain[data-chain="xp"] .chain-fill {
      background: linear-gradient(90deg, var(--xp), color-mix(in oklch, var(--xp) 60%, var(--accent)));
    }
    .badge-chain[data-chain="reward"] .chain-fill {
      background: linear-gradient(90deg, var(--positive), color-mix(in oklch, var(--positive) 60%, var(--primary)));
    }

    .chain-tiers {
      margin-top: 10px;
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .tier-dot {
      flex: 1;
      height: 4px;
      border-radius: 999px;
      background: var(--muted);
      transition: background 0.3s;
      position: relative;
    }
    .tier-dot.filled {
      background: var(--badge);
    }
    .tier-dot.current {
      background: var(--badge);
      box-shadow: 0 0 0 3px color-mix(in oklch, var(--badge) 25%, transparent);
      animation: tier-pulse 2s ease-in-out infinite;
    }
    .badge-chain[data-chain="streak"] .tier-dot.filled,
    .badge-chain[data-chain="streak"] .tier-dot.current { background: var(--streak); }
    .badge-chain[data-chain="streak"] .tier-dot.current { box-shadow: 0 0 0 3px color-mix(in oklch, var(--streak) 25%, transparent); }
    .badge-chain[data-chain="level"] .tier-dot.filled,
    .badge-chain[data-chain="level"] .tier-dot.current { background: var(--accent); }
    .badge-chain[data-chain="level"] .tier-dot.current { box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 25%, transparent); }
    .badge-chain[data-chain="xp"] .tier-dot.filled,
    .badge-chain[data-chain="xp"] .tier-dot.current { background: var(--xp); }
    .badge-chain[data-chain="xp"] .tier-dot.current { box-shadow: 0 0 0 3px color-mix(in oklch, var(--xp) 25%, transparent); }
    .badge-chain[data-chain="reward"] .tier-dot.filled,
    .badge-chain[data-chain="reward"] .tier-dot.current { background: var(--positive); }
    .badge-chain[data-chain="reward"] .tier-dot.current { box-shadow: 0 0 0 3px color-mix(in oklch, var(--positive) 25%, transparent); }

    @keyframes tier-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.65; }
    }

    .badges-summary {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px;
      margin-bottom: 16px;
      border-radius: 1rem;
      background: color-mix(in oklch, var(--badge) 8%, var(--muted) 40%);
      border: 1px solid color-mix(in oklch, var(--badge) 25%, var(--border));
    }
    .badges-summary-icon {
      width: 40px; height: 40px;
      display: grid; place-items: center;
      border-radius: 999px;
      background: color-mix(in oklch, var(--badge) 18%, transparent);
      color: var(--badge);
      flex-shrink: 0;
    }
    .badges-summary-icon svg { width: 20px; height: 20px; }
    .badges-summary-text { min-width: 0; flex: 1; }
    .badges-summary-title { font-family: var(--font-display); font-size: 1rem; font-weight: 800; }
    .badges-summary-sub { font-size: 0.72rem; color: var(--muted-foreground); margin-top: 2px; }
    .badges-summary-bar {
      margin-top: 8px;
      height: 4px;
      border-radius: 999px;
      background: color-mix(in oklch, var(--badge) 25%, var(--muted));
      overflow: hidden;
    }
    .badges-summary-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--badge);
      transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Forms */
    .form-card { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .field-label {
      display: block;
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted-foreground);
    }
    .field-input, .field-select {
      margin-top: 6px;
      width: 100%;
      padding: 10px 12px;
      border-radius: 0.75rem;
      border: 1px solid var(--input);
      background: var(--background);
      color: var(--foreground);
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field-input:focus, .field-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 30%, transparent);
    }
    .btn-row { display: grid; gap: 8px; }
    .btn-row.two { grid-template-columns: 1fr 1fr; }
    .btn-row.three { grid-template-columns: 1fr 1fr 1fr; }
    .btn-toggle {
      padding: 10px;
      border-radius: 0.75rem;
      border: 1px solid var(--input);
      background: var(--background);
      color: var(--muted-foreground);
      font-weight: 600; font-size: 0.875rem;
      text-transform: capitalize;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-toggle.active { border-color: var(--primary); background: var(--primary); color: var(--primary-foreground); }
    .btn-primary {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 12px;
      border: 0; border-radius: 0.75rem;
      background: var(--primary);
      color: var(--primary-foreground);
      font-family: var(--font-display);
      font-weight: 700; font-size: 0.875rem;
      cursor: pointer;
      box-shadow: var(--shadow-lift);
      transition: transform 0.15s;
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary svg { width: 16px; height: 16px; }
    .btn-ghost {
      padding: 10px 16px;
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted-foreground);
      font-weight: 700; font-size: 0.875rem;
      cursor: pointer;
    }
    .btn-outline {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 12px;
      border-radius: 0.75rem;
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--muted-foreground);
      font-weight: 700; font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
    .btn-outline svg { width: 16px; height: 16px; }

    /* Templates */
    .templates-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .template-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 11px;
      border-radius: 999px;
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--muted-foreground);
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .template-chip:hover {
      border-color: var(--primary);
      border-style: solid;
      color: var(--primary);
      background: color-mix(in oklch, var(--primary) 8%, transparent);
    }
    .template-chip:active { transform: scale(0.97); }
    .template-chip svg { width: 12px; height: 12px; }

    /* Reward shop */
    .reward-list { display: flex; flex-direction: column; gap: 10px; }
    .reward-card {
      display: flex; align-items: center; gap: 12px;
      padding: 14px;
      border-radius: 1.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
      transition: opacity 0.2s;
    }
    .reward-card.locked { opacity: 0.7; }
    .reward-icon {
      width: 40px; height: 40px; flex-shrink: 0;
      display: grid; place-items: center;
      border-radius: 999px;
      background: color-mix(in oklch, var(--xp) 15%, transparent);
      color: var(--xp);
    }
    .reward-card.locked .reward-icon { background: var(--muted); color: var(--muted-foreground); }
    .reward-icon svg { width: 20px; height: 20px; }
    .reward-main { min-width: 0; flex: 1; }
    .reward-name { font-size: 0.875rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .reward-cost { font-size: 0.75rem; color: var(--muted-foreground); }
    .reward-delete {
      width: 32px; height: 32px;
      display: grid; place-items: center;
      border: 0; background: transparent;
      border-radius: 999px;
      color: var(--muted-foreground);
      cursor: pointer; flex-shrink: 0;
    }
    .reward-delete:hover { color: var(--destructive); }
    .reward-delete svg { width: 16px; height: 16px; }
    .reward-claim {
      padding: 8px 14px;
      border: 0; border-radius: 999px;
      font-size: 0.75rem; font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s;
      background: var(--primary);
      color: var(--primary-foreground);
      box-shadow: var(--shadow-soft);
      flex-shrink: 0;
    }
    .reward-claim:active { transform: scale(0.95); }
    .reward-claim:disabled { background: var(--muted); color: var(--muted-foreground); cursor: not-allowed; box-shadow: none; }
    .icon-picker { display: flex; flex-wrap: wrap; gap: 8px; }
    .icon-pick {
      width: 36px; height: 36px;
      display: grid; place-items: center;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted-foreground);
      cursor: pointer;
    }
    .icon-pick svg { width: 16px; height: 16px; }
    .icon-pick.active { border-color: var(--primary); background: color-mix(in oklch, var(--primary) 15%, transparent); color: var(--primary); }
    .redeemed-title {
      margin-top: 16px; margin-bottom: 8px;
      font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--muted-foreground);
    }
    .redeemed-list { display: flex; flex-direction: column; gap: 6px; }
    .redeemed-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 12px;
      border-radius: 0.75rem;
      background: color-mix(in oklch, var(--muted) 50%, transparent);
      font-size: 0.75rem;
    }
    .redeemed-row .muted { color: var(--muted-foreground); }

    .empty {
      padding: 24px; text-align: center;
      font-size: 0.875rem; color: var(--muted-foreground);
      border-radius: 1.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
    }
    .empty-icon {
      width: 44px; height: 44px;
      margin: 0 auto 10px;
      display: grid; place-items: center;
      border-radius: 999px;
      background: var(--muted);
      color: var(--muted-foreground);
    }
    .empty-icon svg { width: 22px; height: 22px; }

    /* Bottom sheets */
    .sheet-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: oklch(0 0 0 / 0.55);
      backdrop-filter: blur(2px);
      display: flex; align-items: flex-end; justify-content: center;
      animation: fadeIn 0.25s ease-out;
    }
    .sheet {
      width: 100%; max-width: 460px; max-height: 88vh;
      background: var(--background);
      border-radius: 1.75rem 1.75rem 0 0;
      box-shadow: var(--shadow-sheet);
      display: flex; flex-direction: column;
      animation: slideUp 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      overflow: hidden;
    }
    .sheet-grabber { width: 40px; height: 5px; background: var(--border); border-radius: 999px; margin: 10px auto 0; flex-shrink: 0; }
    .sheet-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 14px 20px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sheet-header h2 { font-family: var(--font-display); font-size: 1.125rem; font-weight: 800; }
    .sheet-count {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 999px;
      background: color-mix(in oklch, var(--badge) 15%, transparent);
      color: var(--badge);
      font-family: var(--font-display); font-weight: 800; font-size: 0.875rem;
    }
    .sheet-count svg { width: 16px; height: 16px; }
    .sheet-coins {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 999px;
      background: color-mix(in oklch, var(--xp) 15%, transparent);
      color: var(--xp);
      font-family: var(--font-display); font-weight: 800; font-size: 0.875rem;
    }
    .sheet-coins svg { width: 16px; height: 16px; }
    .sheet-close {
      width: 34px; height: 34px;
      display: grid; place-items: center;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted-foreground);
      cursor: pointer; transition: color 0.15s; flex-shrink: 0;
    }
    .sheet-close:hover { color: var(--foreground); }
    .sheet-close svg { width: 16px; height: 16px; }
    .sheet-body { padding: 16px 20px 28px; overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }

    /* Stats */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-card {
      background: color-mix(in oklch, var(--muted) 50%, var(--card));
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 14px;
      text-align: center;
    }
    .stat-value { font-family: var(--font-display); font-size: 1.75rem; font-weight: 800; line-height: 1; color: var(--primary); }
    .stat-label { margin-top: 4px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted-foreground); font-weight: 600; }
    .stats-subtitle {
      font-family: var(--font-display);
      font-size: 0.75rem; font-weight: 700;
      margin: 22px 0 10px;
      color: var(--muted-foreground);
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .chart {
      display: flex; align-items: flex-end;
      gap: 4px; height: 110px;
      padding: 8px 0 0;
    }
    .chart-col {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; gap: 4px;
      height: 100%; justify-content: flex-end;
      min-width: 0;
    }
    .chart-bar {
      width: 100%;
      background: linear-gradient(to top, var(--primary), color-mix(in oklch, var(--primary) 65%, var(--accent)));
      border-radius: 4px 4px 2px 2px;
      min-height: 3px;
      transition: height 0.4s;
    }
    .chart-bar.empty { background: var(--muted); }
    .chart-label { font-size: 9px; color: var(--muted-foreground); font-weight: 600; }
    .chart-label.today { color: var(--primary); font-weight: 800; }
    .highlight-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; border-radius: 0.75rem;
      background: color-mix(in oklch, var(--muted) 40%, transparent);
      font-size: 0.8125rem; margin-bottom: 6px;
    }
    .highlight-row strong { font-family: var(--font-display); font-weight: 700; }

    /* Level-up modal */
    .levelup-overlay {
      position: fixed; inset: 0; z-index: 250;
      background: oklch(0 0 0 / 0.7);
      backdrop-filter: blur(6px);
      display: grid; place-items: center;
      padding: 20px;
      animation: fadeIn 0.25s;
      cursor: pointer;
    }
    .levelup-card {
      position: relative;
      background: var(--card);
      border: 1px solid color-mix(in oklch, var(--primary) 40%, var(--border));
      border-radius: 2rem;
      padding: 40px 28px 32px;
      max-width: 340px; width: 100%;
      text-align: center;
      box-shadow: 0 30px 60px oklch(0 0 0 / 0.4);
      animation: levelupPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: default;
      overflow: hidden;
    }
    .levelup-card::before {
      content: "";
      position: absolute;
      inset: -50%;
      background: radial-gradient(circle, color-mix(in oklch, var(--primary) 30%, transparent) 0%, transparent 60%);
      animation: levelupGlow 2.5s ease-in-out infinite;
      pointer-events: none;
    }
    .levelup-content { position: relative; z-index: 1; }
    .levelup-crown {
      width: 44px; height: 44px;
      margin: 0 auto 8px;
      color: var(--accent);
      stroke-width: 2;
      filter: drop-shadow(0 4px 12px color-mix(in oklch, var(--accent) 50%, transparent));
      animation: pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .levelup-label {
      font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--primary);
    }
    .levelup-number {
      font-family: var(--font-display);
      font-size: 5rem; font-weight: 800; line-height: 1;
      margin: 6px 0 4px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .levelup-title {
      font-family: var(--font-display);
      font-size: 1.25rem; font-weight: 700;
      margin-bottom: 20px;
    }
    .levelup-rewards {
      display: flex; justify-content: center; gap: 8px;
      flex-wrap: wrap; margin-bottom: 24px;
    }
    .levelup-rewards span {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 6px 12px; border-radius: 999px;
      background: color-mix(in oklch, var(--xp) 15%, transparent);
      color: var(--xp);
      font-family: var(--font-display);
      font-weight: 700; font-size: 0.8125rem;
    }
    .levelup-rewards span svg { width: 14px; height: 14px; }
    @keyframes levelupPop {
      0% { transform: scale(0.4) translateY(30px); opacity: 0; }
      60% { transform: scale(1.05) translateY(0); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    @keyframes levelupGlow {
      0%, 100% { transform: scale(1); opacity: 0.55; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    /* Toast */
    .toast {
      position: fixed; left: 50%; bottom: 24px;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--primary);
      color: var(--primary-foreground);
      font-family: var(--font-display);
      font-weight: 700; font-size: 0.875rem;
      padding: 12px 18px; border-radius: 999px;
      box-shadow: var(--shadow-lift);
      z-index: 200;
      animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      max-width: calc(100% - 32px);
      text-align: center;
    }
    .toast > svg, .toast > i {
      width: 16px; height: 16px;
      flex-shrink: 0;
    }
    .toast[hidden] { display: none; }

    /* Undo toast (delete only now) */
    .toast-undo {
      position: fixed; left: 50%; bottom: 24px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--foreground);
      color: var(--background);
      font-size: 0.8125rem;
      padding: 10px 10px 10px 18px;
      border-radius: 999px;
      box-shadow: var(--shadow-lift);
      z-index: 260;
      animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      max-width: calc(100% - 32px);
    }
    .toast-undo[hidden] { display: none; }
    .toast-undo-text {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toast-undo-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border: 0;
      border-radius: 999px;
      background: var(--primary);
      color: var(--primary-foreground);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
      transition: transform 0.15s;
      flex-shrink: 0;
    }
    .toast-undo-btn:hover { background: color-mix(in oklch, var(--primary) 90%, white); }
    .toast-undo-btn:active { transform: scale(0.95); }
    .toast-undo-btn svg { width: 12px; height: 12px; }

    /* Animations */
    @keyframes xp-float {
      0% { opacity: 0; transform: translateY(6px) scale(0.85); }
      25% { opacity: 1; transform: translateY(-4px) scale(1.08); }
      100% { opacity: 0; transform: translateY(-34px) scale(1); }
    }
    @keyframes pop {
      0% { transform: scale(0.85); }
      60% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main class="app" id="app"></main>
  <div id="sheet-root"></div>
  <div id="modal-root"></div>
  <div class="toast" id="toast" hidden></div>
  <div class="toast-undo" id="toast-undo" hidden>
    <span class="toast-undo-text" id="toast-undo-text"></span>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script>
  (function () {

    const CHORE_TEMPLATES = [
      { name: "Clean bathroom",     category: "Bathroom",    difficulty: "hard" },

      { name: "Fold laundry",       category: "Laundry",     difficulty: "medium" },

      { name: "Take out trash",     category: "Kitchen",     difficulty: "easy" },
      { name: "Change bed sheets",  category: "Bedroom",     difficulty: "medium" },
      { name: "Water the plants",   category: "Outdoors",    difficulty: "easy" },

    const LEVEL_TITLES = [
      "Newcomer", "Rookie", "Tidy Apprentice", "Dust Slayer",
      "Room Ranger", "Home Hero", "Chore Champion", "Grandmaster of Clean",
      "Household Legend", "Domestic Deity", "Order Incarnate",
      "Pristine Sage", "Crystal Sovereign", "Eternal Tidiness", "Chorequest Immortal",
    ];

    /* ============================================================
       Badge chains — progressive tiers per theme
       ============================================================ */
    const BADGE_CHAINS = [
      {
        id: "streak",

        tiers: [
          { threshold: 3,   name: "Kindling",       hint: "3-day streak" },
          { threshold: 7,   name: "Week Warrior",   hint: "7-day streak" },

        ],
        getValue: (s) => s.bestStreak,
        formatValue: (v) => `${v} day${v === 1 ? "" : "s"}`,
      },
      {

          { threshold: 1,   name: "First Sweep",   hint: "Complete 1 chore" },
