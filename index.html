<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chorequest — Level up your household chores</title>
  <meta name="description" content="Turn weekly and monthly chores into a game: earn XP, keep your streak alive, unlock badges and level up every time you clean.">
  <meta property="og:title" content="Chorequest — Level up your household chores">
  <meta property="og:description" content="Turn weekly and monthly chores into a game: earn XP, keep your streak alive, unlock badges and level up every time you clean.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <!-- ===== PWA ===== -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#40a88b" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111713" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Chorequest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">
  <!-- ===== /PWA ===== -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --background: oklch(0.985 0.012 95);
      --foreground: oklch(0.24 0.03 165);
      --card: oklch(1 0 0);
      --card-foreground: oklch(0.24 0.03 165);
      --primary: oklch(0.62 0.13 172);
      --primary-foreground: oklch(0.99 0.01 170);
      --secondary: oklch(0.95 0.02 170);
      --secondary-foreground: oklch(0.32 0.05 170);
      --muted: oklch(0.955 0.012 120);
      --muted-foreground: oklch(0.53 0.02 170);
      --accent: oklch(0.8 0.15 78);
      --accent-foreground: oklch(0.28 0.06 60);
      --destructive: oklch(0.6 0.19 25);
      --destructive-foreground: oklch(0.99 0 0);
      --border: oklch(0.9 0.015 160);
      --input: oklch(0.92 0.012 160);
      --ring: oklch(0.62 0.13 172);
      --xp: oklch(0.62 0.13 172);
      --streak: oklch(0.7 0.17 45);
      --badge: oklch(0.65 0.15 300);
      --freeze: oklch(0.72 0.12 230);
      --positive: oklch(0.65 0.15 155);
      --negative: oklch(0.6 0.18 25);
      --easy: oklch(0.68 0.13 160);
      --medium: oklch(0.76 0.15 80);
      --hard: oklch(0.63 0.17 25);
      --shadow-soft: 0 1px 2px oklch(0.3 0.03 170 / 0.06), 0 6px 16px oklch(0.3 0.03 170 / 0.06);
      --shadow-lift: 0 10px 30px oklch(0.3 0.03 170 / 0.14);
      --shadow-sheet: 0 -20px 60px oklch(0 0 0 / 0.25);
      --font-display: "Space Grotesk", ui-sans-serif, sans-serif;
      --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
      --nav-h: 64px;
    }
    html.dark {
      --background: oklch(0.19 0.02 175);
      --foreground: oklch(0.96 0.01 160);
      --card: oklch(0.235 0.022 175);
      --card-foreground: oklch(0.96 0.01 160);
      --primary: oklch(0.75 0.14 172);
      --primary-foreground: oklch(0.2 0.03 175);
      --secondary: oklch(0.29 0.025 175);
      --secondary-foreground: oklch(0.94 0.01 160);
      --muted: oklch(0.28 0.02 175);
      --muted-foreground: oklch(0.72 0.02 165);
      --accent: oklch(0.82 0.15 78);
      --accent-foreground: oklch(0.24 0.05 60);
      --destructive: oklch(0.66 0.18 25);
      --destructive-foreground: oklch(0.98 0 0);
      --border: oklch(1 0 0 / 10%);
      --input: oklch(1 0 0 / 14%);
      --ring: oklch(0.75 0.14 172);
      --xp: oklch(0.78 0.14 172);
      --streak: oklch(0.78 0.16 55);
      --badge: oklch(0.78 0.14 300);
      --freeze: oklch(0.8 0.13 230);
      --positive: oklch(0.78 0.14 155);
      --negative: oklch(0.72 0.17 25);
      --easy: oklch(0.75 0.13 160);
      --medium: oklch(0.82 0.14 85);
      --hard: oklch(0.7 0.16 25);
      --shadow-soft: 0 1px 2px oklch(0 0 0 / 0.3), 0 6px 16px oklch(0 0 0 / 0.28);
      --shadow-lift: 0 12px 34px oklch(0 0 0 / 0.45);
      --shadow-sheet: 0 -20px 60px oklch(0 0 0 / 0.6);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    body.sheet-open { overflow: hidden; }
    h1, h2, h3 { font-family: var(--font-display); letter-spacing: -0.02em; margin: 0; }
    p { margin: 0; }
    button { font: inherit; }
    input, select { font: inherit; color: inherit; }
    svg { display: block; }

    /* Content area — bottom padding leaves room for the nav bar */
    .app {
      max-width: 460px;
      margin: 0 auto;
      padding: 20px 16px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom, 0px));
    }

    /* Header */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; gap: 8px;
    }
    .brand { min-width: 0; }
    .brand h1 { font-size: 1.2rem; font-weight: 800; }
    .header-actions { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .icon-btn {
      width: 36px; height: 36px;
      display: grid; place-items: center;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted-foreground);
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
      position: relative;
      padding: 0;
    }
    .icon-btn:hover { color: var(--foreground); }
    .icon-btn > svg, .icon-btn > i { width: 15px; height: 15px; }
    .icon-btn.notif-on { border-color: var(--primary); color: var(--primary); }
    .icon-btn.notif-off { opacity: 0.6; }
    @media (max-width: 420px) {
      .icon-btn { width: 34px; height: 34px; }
      .icon-btn > svg, .icon-btn > i { width: 14px; height: 14px; }
      .brand h1 { font-size: 1.1rem; }
    }

    /* Overflow menu */
    .overflow-wrap { position: relative; }
    .overflow-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 190px;
      padding: 6px;
      border-radius: 1rem;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lift);
      z-index: 60;
      animation: pop 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .overflow-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-radius: 0.75rem;
      background: transparent;
      color: var(--foreground);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s;
    }
    .overflow-menu-item:hover { background: var(--muted); }
    .overflow-menu-item > i { width: 16px; height: 16px; color: var(--muted-foreground); }
    .overflow-menu-item.active { color: var(--primary); }
    .overflow-menu-item.active > i { color: var(--primary); }

    /* Bottom navigation */
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 80;
      display: flex;
      align-items: stretch;
      justify-content: space-around;
      padding: 6px 0 max(6px, env(safe-area-inset-bottom));
      background: color-mix(in oklch, var(--card) 92%, transparent);
      backdrop-filter: blur(14px) saturate(1.4);
      -webkit-backdrop-filter: blur(14px) saturate(1.4);
      border-top: 1px solid var(--border);
      padding-bottom: max(6px, env(safe-area-inset-bottom));
    }
    /* Constrain the nav's inner content to the same 500px column as .app
       by padding the sides with the leftover space. */
    @media (min-width: 500px) {
      .bottom-nav {
        padding-left: calc(50vw - 250px);
        padding-right: calc(50vw - 250px);
      }
    }
    .bottom-nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 4px 6px;
      border: 0;
      background: transparent;
      color: var(--muted-foreground);
      font-family: var(--font-sans);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: color 0.15s;
      -webkit-tap-highlight-color: transparent;
      min-width: 0;
    }
    .bottom-nav-item:hover { color: var(--foreground); }
    .bottom-nav-item.active { color: var(--primary); }
    .bottom-nav-icon {
      display: grid;
      place-items: center;
      width: 56px;
      height: 28px;
      border-radius: 999px;
      transition: background 0.2s;
    }
    .bottom-nav-item.active .bottom-nav-icon {
      background: color-mix(in oklch, var(--primary) 15%, transparent);
    }
    .bottom-nav-icon > svg, .bottom-nav-icon > i {
      width: 20px; height: 20px;
      stroke-width: 2.2;
    }
    .bottom-nav-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    /* Floating action button — only shown on the Chores tab */
    .fab {
      position: fixed;
      bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px));
      right: max(16px, calc(50vw - 250px + 16px));
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 999px;
      background: var(--primary);
      color: var(--primary-foreground);
      cursor: pointer;
      z-index: 90;
      box-shadow: 0 8px 22px color-mix(in oklch, var(--primary) 40%, transparent), var(--shadow-lift);
      transition: transform 0.15s, box-shadow 0.2s;
    }
    .fab:hover { transform: translateY(-2px); box-shadow: 0 12px 28px color-mix(in oklch, var(--primary) 45%, transparent), var(--shadow-lift); }
    .fab:active { transform: scale(0.94); }
    .fab > svg, .fab > i { width: 24px; height: 24px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      box-shadow: var(--shadow-soft);
    }

    /* Level card */
    .level-card { padding: 20px; animation: rise 0.45s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .level-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
    .level-label {
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--primary);
    }
    .level-number-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .level-number {
      font-family: var(--font-display);
      font-size: 3.75rem; font-weight: 800; line-height: 1;
      animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .level-title-inline {
      font-family: var(--font-display);
      font-size: 1.0625rem;
      font-weight: 600;
      color: var(--muted-foreground);
      letter-spacing: -0.01em;
      padding-bottom: 4px;
    }
    .level-total { text-align: right; }
    .level-total .xp-total { font-family: var(--font-display); font-size: 0.875rem; font-weight: 700; color: var(--xp); }
    .level-total .xp-next { font-size: 0.75rem; color: var(--muted-foreground); }
    .xp-bar { margin-top: 16px; height: 12px; border-radius: 999px; background: var(--muted); overflow: hidden; }
    .xp-bar-fill { height: 100%; border-radius: 999px; background: var(--primary); transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1); }
    .xp-caption { margin-top: 6px; font-size: 11px; color: var(--muted-foreground); }

    .ring-block {
      margin-top: 16px; display: flex; align-items: center; gap: 12px;
      background: color-mix(in oklch, var(--muted) 60%, transparent);
      border-radius: 1rem; padding: 12px;
    }
    .ring-wrap { position: relative; width: 64px; height: 64px; flex-shrink: 0; }
    .ring-wrap svg { width: 64px; height: 64px; transform: rotate(-90deg); }
    .ring-value { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 0.875rem; }
    .ring-text .ring-title { font-family: var(--font-display); font-weight: 700; font-size: 0.875rem; }
    .ring-text .ring-caption { font-size: 0.75rem; color: var(--muted-foreground); }

    /* Dashboard quick stats */
    .dash-stats {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .dash-stat {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-radius: 1rem;
      background: color-mix(in oklch, var(--muted) 55%, transparent);
      transition: transform 0.2s, background 0.2s;
      text-align: left;
      border: 0;
      width: 100%;
      color: inherit;
      font: inherit;
    }
    .dash-stat.clickable { cursor: pointer; }
    .dash-stat.clickable:hover { background: color-mix(in oklch, var(--badge) 10%, var(--muted) 55%); }
    .dash-stat.clickable:active { transform: scale(0.98); }
    .dash-stat-icon {
      width: 34px; height: 34px;
      display: grid; place-items: center;
      border-radius: 999px;
      flex-shrink: 0;
    }
    .dash-stat-icon svg { width: 17px; height: 17px; }
    .dash-stat.streak .dash-stat-icon { background: color-mix(in oklch, var(--streak) 18%, transparent); color: var(--streak); }
    .dash-stat.badges .dash-stat-icon { background: color-mix(in oklch, var(--badge) 18%, transparent); color: var(--badge); }
    .dash-stat-info { min-width: 0; flex: 1; }
    .dash-stat-value {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 800;
      line-height: 1;
      display: flex;
      align-items: baseline;
      gap: 2px;
    }
    .dash-stat-value .unit {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--muted-foreground);
      margin-left: 3px;
    }
    .dash-stat-label {
      margin-top: 2px;
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted-foreground);
    }
    .dash-stat-extra {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      margin-left: auto;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--freeze);
    }
    .dash-stat-extra svg { width: 11px; height: 11px; }
    .dash-badge-progress {
      margin-top: 6px;
      height: 3px;
      border-radius: 999px;
      background: color-mix(in oklch, var(--badge) 20%, var(--muted));
      overflow: hidden;
    }
    .dash-badge-progress-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--badge);
      transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .section { margin-top: 24px; }
    .section-title { font-family: var(--font-display); font-weight: 700; font-size: 1rem; margin-bottom: 12px; }

    /* Tabs + filters */
    .tabs-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
    .tabs { display: flex; gap: 4px; padding: 4px; background: var(--muted); border-radius: 999px; }
    .tab {
      border: 0; background: transparent;
      padding: 4px 12px; border-radius: 999px;
      font-size: 0.75rem; font-weight: 700;
      color: var(--muted-foreground);
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
    }
    .tab:hover { color: var(--foreground); }
    .tab.active { background: var(--card); color: var(--foreground); box-shadow: 0 1px 2px oklch(0 0 0 / 0.06); }
    .chores-summary { font-size: 0.75rem; color: var(--muted-foreground); }

    .filter-row {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted-foreground);
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-chip:hover { color: var(--foreground); border-color: color-mix(in oklch, var(--primary) 30%, var(--border)); }
    .filter-chip.active {
      background: var(--primary);
      color: var(--primary-foreground);
      border-color: var(--primary);
    }
    .filter-chip .filter-count {
      display: inline-block;
      padding: 0 5px;
      border-radius: 999px;
      background: color-mix(in oklch, currentColor 15%, transparent);
      font-size: 0.65rem;
      font-weight: 800;
      min-width: 16px;
      text-align: center;
    }
    .filter-chip.active .filter-count {
      background: color-mix(in oklch, var(--primary-foreground) 25%, transparent);
    }

    /* Chore list */
    .chore-groups { display: flex; flex-direction: column; gap: 4px; }
    .category-title {
      display: flex; align-items: center; gap: 7px;
      font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--muted-foreground);
      margin: 16px 0 8px;
    }
    .category-title:first-child { margin-top: 0; }
    .category-title .cat-icon {
      width: 13px; height: 13px;
      color: var(--primary);
      stroke-width: 2.5;
      flex-shrink: 0;
    }
    .chore-list { display: flex; flex-direction: column; gap: 10px; }

    .chore-card {
      position: relative;
      display: flex; align-items: center; gap: 12px;
      padding: 14px;
      border-radius: 1.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
      transition: opacity 0.3s, transform 0.2s, box-shadow 0.2s;
      /* `backwards` (not `both`) so the animation stops applying after it ends
         and the hover-lift transform below can take effect. */
      animation: rise 0.45s cubic-bezier(0.22, 1, 0.36, 1) backwards;
    }
    .chore-card.done { opacity: 0.6; }
    .chore-main { min-width: 0; flex: 1; }
    .chore-name {
      font-family: var(--font-display);
      font-size: 15px; font-weight: 700; line-height: 1.2;
      display: flex; align-items: center; gap: 8px;
    }
    .chore-name .chore-name-icon {
      width: 15px; height: 15px;
      color: var(--muted-foreground);
      stroke-width: 2;
      flex-shrink: 0;
    }
    .chore-card.done .chore-name { color: var(--muted-foreground); text-decoration: line-through; }
    .chore-card.done .chore-name .chore-name-icon { color: var(--muted-foreground); opacity: 0.7; }
    .chore-tags { margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 11px; }
    .chip {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-weight: 500;
      background: var(--secondary);
      color: var(--secondary-foreground);
    }
    .chip.difficulty { font-weight: 600; text-transform: capitalize; }
    .chip.easy { background: color-mix(in oklch, var(--easy) 15%, transparent); color: var(--easy); }
    .chip.medium { background: color-mix(in oklch, var(--medium) 20%, transparent); color: var(--medium); }
    .chip.hard { background: color-mix(in oklch, var(--hard) 15%, transparent); color: var(--hard); }
    .chore-actions { position: relative; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .chore-xp { font-family: var(--font-display); font-weight: 700; font-size: 0.875rem; color: var(--xp); }
    .chore-btn {
      width: 40px; height: 40px;
      display: grid; place-items: center;
      border-radius: 0.75rem;
      border: 2px solid var(--border);
      background: transparent;
      color: var(--muted-foreground);
      cursor: pointer;
      transition: all 0.2s;
    }
    .chore-btn:hover { border-color: var(--primary); background: var(--primary); color: var(--primary-foreground); }
    .chore-btn:active { transform: scale(0.9); }
    .chore-btn svg { width: 20px; height: 20px; }
    .chore-btn.ghost { border-color: transparent; border-width: 0; }
    .chore-btn.ghost:hover { background: var(--muted); color: var(--foreground); }
    .chore-btn.ghost.undo-hover:hover { background: color-mix(in oklch, var(--primary) 15%, transparent); color: var(--primary); }
    .chore-btn.delete-hover:hover { background: color-mix(in oklch, var(--destructive) 15%, transparent); color: var(--destructive); }

    @keyframes justDone {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
    .chore-card.just-completed {
      animation: justDone 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
    }

    /* Card frames (cosmetics) */
    .chore-card[data-frame="gold"] {
      border-color: color-mix(in oklch, #f59e0b 55%, var(--border));
      box-shadow: 0 0 0 1px color-mix(in oklch, #f59e0b 30%, transparent), var(--shadow-soft);
      background: linear-gradient(135deg, color-mix(in oklch, #f59e0b 6%, var(--card)) 0%, var(--card) 55%);
    }
    .chore-card[data-frame="neon"] {
      border-color: color-mix(in oklch, #d946ef 60%, var(--border));
      box-shadow: 0 0 0 1px color-mix(in oklch, #d946ef 35%, transparent), 0 0 12px color-mix(in oklch, #d946ef 20%, transparent), var(--shadow-soft);
      background: linear-gradient(135deg, color-mix(in oklch, #d946ef 5%, var(--card)) 0%, var(--card) 55%);
    }
    .chore-card[data-frame="vines"] {
      border-color: color-mix(in oklch, #22c55e 55%, var(--border));
      box-shadow: 0 0 0 1px color-mix(in oklch, #22c55e 30%, transparent), var(--shadow-soft);
      background: linear-gradient(135deg, color-mix(in oklch, #22c55e 6%, var(--card)) 0%, var(--card) 55%);
    }
    .chore-card[data-frame="galaxy"] {
      border-color: color-mix(in oklch, #8b5cf6 55%, var(--border));
      box-shadow: 0 0 0 1px color-mix(in oklch, #8b5cf6 30%, transparent), var(--shadow-soft);
      background: linear-gradient(135deg, color-mix(in oklch, #8b5cf6 6%, var(--card)) 0%, color-mix(in oklch, #ec4899 4%, var(--card)) 100%);
    }

    .xp-float {
      position: absolute; top: -24px; right: 0;
      pointer-events: none;
      font-family: var(--font-display);
      font-weight: 700; font-size: 0.875rem;
      color: var(--xp);
      animation: xp-float 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .xp-float.negative { color: var(--negative); }

    /* Badge chains */
    .chain-list { display: flex; flex-direction: column; gap: 10px; }
    .badge-chain {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      box-shadow: var(--shadow-soft);
      padding: 14px;
      transition: opacity 0.2s;
    }
    .chain-head { display: flex; align-items: center; gap: 12px; }
    .chain-icon {
      width: 42px; height: 42px;
      display: grid; place-items: center;
      border-radius: 999px;
      flex-shrink: 0;
      background: color-mix(in oklch, var(--badge) 15%, transparent);
      color: var(--badge);
    }
    .chain-icon svg { width: 20px; height: 20px; }
    .badge-chain[data-chain="streak"] .chain-icon {
      background: color-mix(in oklch, var(--streak) 18%, transparent);
      color: var(--streak);
    }
    .badge-chain[data-chain="level"] .chain-icon {
      background: color-mix(in oklch, var(--accent) 20%, transparent);
      color: var(--accent-foreground);
    }
    .badge-chain[data-chain="xp"] .chain-icon {
      background: color-mix(in oklch, var(--xp) 15%, transparent);
      color: var(--xp);
    }
    .badge-chain[data-chain="reward"] .chain-icon {
      background: color-mix(in oklch, var(--positive) 18%, transparent);
      color: var(--positive);
    }
    .chain-info { min-width: 0; flex: 1; }
    .chain-name {
      font-family: var(--font-display);
      font-size: 0.9375rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .chain-sub {
      margin-top: 3px;
      font-size: 0.72rem;
      color: var(--muted-foreground);
      line-height: 1.3;
    }
    .chain-sub strong { color: var(--foreground); font-weight: 700; }
    .chain-count {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      background: color-mix(in oklch, var(--badge) 15%, transparent);
      color: var(--badge);
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 0.75rem;
    }
    .badge-chain.maxed .chain-count {
      background: color-mix(in oklch, var(--positive) 18%, transparent);
      color: var(--positive);
    }

    .chain-bar {
      margin-top: 12px;
      height: 6px;
      border-radius: 999px;
      background: var(--muted);
      overflow: hidden;
    }
    .chain-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--badge), color-mix(in oklch, var(--badge) 60%, var(--accent)));
      transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .badge-chain[data-chain="streak"] .chain-fill {
      background: linear-gradient(90deg, var(--streak), color-mix(in oklch, var(--streak) 60%, var(--accent)));
    }
    .badge-chain[data-chain="level"] .chain-fill {
      background: linear-gradient(90deg, var(--accent), color-mix(in oklch, var(--accent) 60%, var(--primary)));
    }
    .badge-chain[data-chain="xp"] .chain-fill {
      background: linear-gradient(90deg, var(--xp), color-mix(in oklch, var(--xp) 60%, var(--accent)));
    }
    .badge-chain[data-chain="reward"] .chain-fill {
      background: linear-gradient(90deg, var(--positive), color-mix(in oklch, var(--positive) 60%, var(--primary)));
    }

    .chain-tiers { margin-top: 10px; display: flex; gap: 4px; align-items: center; }
    .tier-dot {
      flex: 1;
      height: 4px;
      border-radius: 999px;
      background: var(--muted);
      transition: background 0.3s;
      position: relative;
    }
    .tier-dot.filled { background: var(--badge); }
    .tier-dot.current {
      background: var(--badge);
      box-shadow: 0 0 0 3px color-mix(in oklch, var(--badge) 25%, transparent);
      animation: tier-pulse 2s ease-in-out infinite;
    }
    .badge-chain[data-chain="streak"] .tier-dot.filled,
    .badge-chain[data-chain="streak"] .tier-dot.current { background: var(--streak); }
    .badge-chain[data-chain="streak"] .tier-dot.current { box-shadow: 0 0 0 3px color-mix(in oklch, var(--streak) 25%, transparent); }
    .badge-chain[data-chain="level"] .tier-dot.filled,
    .badge-chain[data-chain="level"] .tier-dot.current { background: var(--accent); }
    .badge-chain[data-chain="level"] .tier-dot.current { box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 25%, transparent); }
    .badge-chain[data-chain="xp"] .tier-dot.filled,
    .badge-chain[data-chain="xp"] .tier-dot.current { background: var(--xp); }
    .badge-chain[data-chain="xp"] .tier-dot.current { box-shadow: 0 0 0 3px color-mix(in oklch, var(--xp) 25%, transparent); }
    .badge-chain[data-chain="reward"] .tier-dot.filled,
    .badge-chain[data-chain="reward"] .tier-dot.current { background: var(--positive); }
    .badge-chain[data-chain="reward"] .tier-dot.current { box-shadow: 0 0 0 3px color-mix(in oklch, var(--positive) 25%, transparent); }

    @keyframes tier-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.65; }
    }

    .badges-summary {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px;
      margin-bottom: 16px;
      border-radius: 1rem;
      background: color-mix(in oklch, var(--badge) 8%, var(--muted) 40%);
      border: 1px solid color-mix(in oklch, var(--badge) 25%, var(--border));
    }
    .badges-summary-icon {
      width: 40px; height: 40px;
      display: grid; place-items: center;
      border-radius: 999px;
      background: color-mix(in oklch, var(--badge) 18%, transparent);
      color: var(--badge);
      flex-shrink: 0;
    }
    .badges-summary-icon svg { width: 20px; height: 20px; }
    .badges-summary-text { min-width: 0; flex: 1; }
    .badges-summary-title { font-family: var(--font-display); font-size: 1rem; font-weight: 800; }
    .badges-summary-sub { font-size: 0.72rem; color: var(--muted-foreground); margin-top: 2px; }
    .badges-summary-bar {
      margin-top: 8px;
      height: 4px;
      border-radius: 999px;
      background: color-mix(in oklch, var(--badge) 25%, var(--muted));
      overflow: hidden;
    }
    .badges-summary-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--badge);
      transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Forms */
    .form-card { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .field-label {
      display: block;
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted-foreground);
    }
    .field-input, .field-select {
      margin-top: 6px;
      width: 100%;
      padding: 10px 12px;
      border-radius: 0.75rem;
      border: 1px solid var(--input);
      background: var(--background);
      color: var(--foreground);
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field-input:focus, .field-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 30%, transparent);
    }
    .btn-row { display: grid; gap: 8px; }
    .btn-row.two { grid-template-columns: 1fr 1fr; }
    .btn-row.three { grid-template-columns: 1fr 1fr 1fr; }
    .btn-toggle {
      padding: 10px;
      border-radius: 0.75rem;
      border: 1px solid var(--input);
      background: var(--background);
      color: var(--muted-foreground);
      font-weight: 600; font-size: 0.875rem;
      text-transform: capitalize;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-toggle.active { border-color: var(--primary); background: var(--primary); color: var(--primary-foreground); }
    .btn-primary {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 12px;
      border: 0; border-radius: 0.75rem;
      background: var(--primary);
      color: var(--primary-foreground);
      font-family: var(--font-display);
      font-weight: 700; font-size: 0.875rem;
      cursor: pointer;
      box-shadow: var(--shadow-lift);
      transition: transform 0.15s;
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary svg { width: 16px; height: 16px; }
    .btn-ghost {
      padding: 10px 16px;
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted-foreground);
      font-weight: 700; font-size: 0.875rem;
      cursor: pointer;
    }
    .btn-outline {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 12px;
      border-radius: 0.75rem;
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--muted-foreground);
      font-weight: 700; font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
    .btn-outline svg { width: 16px; height: 16px; }

    /* Templates */
    .templates-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .template-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 11px;
      border-radius: 999px;
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--muted-foreground);
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .template-chip:hover {
      border-color: var(--primary);
      border-style: solid;
      color: var(--primary);
      background: color-mix(in oklch, var(--primary) 8%, transparent);
    }
    .template-chip:active { transform: scale(0.97); }
    .template-chip svg { width: 12px; height: 12px; }

    /* Reward shop */
    .reward-list { display: flex; flex-direction: column; gap: 10px; }
    .reward-card {
      display: flex; align-items: center; gap: 12px;
      padding: 14px;
      border-radius: 1.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
      transition: opacity 0.2s;
    }
    .reward-card.locked { opacity: 0.7; }
    .reward-icon {
      width: 40px; height: 40px; flex-shrink: 0;
      display: grid; place-items: center;
      border-radius: 999px;
      background: color-mix(in oklch, var(--xp) 15%, transparent);
      color: var(--xp);
    }
    .reward-card.locked .reward-icon { background: var(--muted); color: var(--muted-foreground); }
    .reward-icon svg { width: 20px; height: 20px; }
    .reward-main { min-width: 0; flex: 1; }
    .reward-name { font-size: 0.875rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .reward-cost { font-size: 0.75rem; color: var(--muted-foreground); }
    .reward-delete {
      width: 32px; height: 32px;
      display: grid; place-items: center;
      border: 0; background: transparent;
      border-radius: 999px;
      color: var(--muted-foreground);
      cursor: pointer; flex-shrink: 0;
    }
    .reward-delete:hover { color: var(--destructive); }
    .reward-delete svg { width: 16px; height: 16px; }
    .reward-claim {
      padding: 8px 14px;
      border: 0; border-radius: 999px;
      font-size: 0.75rem; font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s;
      background: var(--primary);
      color: var(--primary-foreground);
      box-shadow: var(--shadow-soft);
      flex-shrink: 0;
    }
    .reward-claim:active { transform: scale(0.95); }
    .reward-claim:disabled { background: var(--muted); color: var(--muted-foreground); cursor: not-allowed; box-shadow: none; }
    .icon-picker { display: flex; flex-wrap: wrap; gap: 8px; }
    .icon-pick {
      width: 36px; height: 36px;
      display: grid; place-items: center;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted-foreground);
      cursor: pointer;
    }
    .icon-pick svg { width: 16px; height: 16px; }
    .icon-pick.active { border-color: var(--primary); background: color-mix(in oklch, var(--primary) 15%, transparent); color: var(--primary); }
    .redeemed-title {
      margin-top: 16px; margin-bottom: 8px;
      font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--muted-foreground);
    }
    .redeemed-list { display: flex; flex-direction: column; gap: 6px; }
    .redeemed-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 12px;
      border-radius: 0.75rem;
      background: color-mix(in oklch, var(--muted) 50%, transparent);
      font-size: 0.75rem;
    }
    .redeemed-row .muted { color: var(--muted-foreground); }

    /* Cosmetics shop */
    .shop-tabs {
      display: flex;
      gap: 4px;
      padding: 4px;
      background: var(--muted);
      border-radius: 999px;
      margin-bottom: 16px;
    }
    .shop-tab {
      flex: 1;
      border: 0;
      background: transparent;
      padding: 8px;
      border-radius: 999px;
      font-size: 0.8125rem;
      font-weight: 700;
      color: var(--muted-foreground);
      cursor: pointer;
      transition: all 0.15s;
    }
    .shop-tab:hover { color: var(--foreground); }
    .shop-tab.active { background: var(--card); color: var(--foreground); box-shadow: 0 1px 2px oklch(0 0 0 / 0.06); }

    .cosmetic-section-title {
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted-foreground);
      margin: 20px 0 10px;
    }
    .cosmetic-section-title:first-child { margin-top: 0; }

    .cosmetic-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .cosmetic-card {
      padding: 12px;
      border-radius: 1rem;
      background: var(--card);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
      transition: all 0.2s;
    }
    .cosmetic-card.equipped {
      border-color: var(--primary);
      background: color-mix(in oklch, var(--primary) 8%, var(--card));
      box-shadow: 0 0 0 1px var(--primary);
    }

    .cosmetic-swatch {
      width: 100%;
      height: 52px;
      border-radius: 0.75rem;
      display: grid;
      place-items: center;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.1rem;
      color: #fff;
      text-shadow: 0 1px 2px oklch(0 0 0 / 0.3);
      overflow: hidden;
      position: relative;
    }
    .cosmetic-swatch.frame-preview {
      background: var(--card);
      border: 2px solid var(--frame-color, var(--border));
      color: var(--frame-color, var(--muted-foreground));
      text-shadow: none;
      font-size: 0.7rem;
    }
    .cosmetic-swatch.particles-preview {
      display: flex;
      gap: 4px;
      align-items: center;
      justify-content: center;
      background: color-mix(in oklch, var(--muted) 60%, transparent);
    }
    .cosmetic-swatch.particles-preview > span {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: block;
    }

    .cosmetic-name { font-size: 0.8125rem; font-weight: 700; }
    .cosmetic-status {
      font-size: 0.7rem;
      color: var(--muted-foreground);
      font-weight: 600;
    }
    .cosmetic-status.owned { color: var(--positive); }
    .cosmetic-status.equipped-txt { color: var(--primary); }

    .cosmetic-action {
      padding: 7px 10px;
      border: 0;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
      background: var(--primary);
      color: var(--primary-foreground);
      transition: transform 0.15s, opacity 0.15s;
      font-family: var(--font-display);
    }
    .cosmetic-action:active { transform: scale(0.95); }
    .cosmetic-action:disabled { background: var(--muted); color: var(--muted-foreground); cursor: not-allowed; }
    .cosmetic-action.ghost {
      background: transparent;
      color: var(--foreground);
      border: 1px solid var(--border);
    }
    .cosmetic-action.ghost:hover { border-color: var(--primary); color: var(--primary); }

    .empty {
      padding: 24px; text-align: center;
      font-size: 0.875rem; color: var(--muted-foreground);
      border-radius: 1.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
    }
    .empty-icon {
      width: 44px; height: 44px;
      margin: 0 auto 10px;
      display: grid; place-items: center;
      border-radius: 999px;
      background: var(--muted);
      color: var(--muted-foreground);
    }
    .empty-icon svg { width: 22px; height: 22px; }

    /* Bottom sheets — now used only for the add-chore form */
    .sheet-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: oklch(0 0 0 / 0.55);
      backdrop-filter: blur(2px);
      display: flex; align-items: flex-end; justify-content: center;
      animation: fadeIn 0.25s ease-out;
    }
    .sheet {
      width: 100%; max-width: 460px; max-height: 88vh;
      background: var(--background);
      border-radius: 1.75rem 1.75rem 0 0;
      box-shadow: var(--shadow-sheet);
      display: flex; flex-direction: column;
      animation: slideUp 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      overflow: hidden;
    }
    .sheet-grabber { width: 40px; height: 5px; background: var(--border); border-radius: 999px; margin: 10px auto 0; flex-shrink: 0; }
    .sheet-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 14px 20px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sheet-header h2 { font-family: var(--font-display); font-size: 1.125rem; font-weight: 800; }
    .sheet-coins {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 999px;
      background: color-mix(in oklch, var(--xp) 15%, transparent);
      color: var(--xp);
      font-family: var(--font-display); font-weight: 800; font-size: 0.875rem;
    }
    .sheet-coins svg { width: 16px; height: 16px; }
    .sheet-close {
      width: 34px; height: 34px;
      display: grid; place-items: center;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted-foreground);
      cursor: pointer; transition: color 0.15s; flex-shrink: 0;
    }
    .sheet-close:hover { color: var(--foreground); }
    .sheet-close svg { width: 16px; height: 16px; }
    .sheet-body { padding: 16px 20px 28px; overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }

    /* Stats */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-card {
      background: color-mix(in oklch, var(--muted) 50%, var(--card));
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 14px;
      text-align: center;
    }
    .stat-value { font-family: var(--font-display); font-size: 1.75rem; font-weight: 800; line-height: 1; color: var(--primary); }
    .stat-label { margin-top: 4px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted-foreground); font-weight: 600; }
    .stats-subtitle {
      font-family: var(--font-display);
      font-size: 0.75rem; font-weight: 700;
      margin: 22px 0 10px;
      color: var(--muted-foreground);
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .chart {
      display: flex; align-items: flex-end;
      gap: 4px; height: 110px;
      padding: 8px 0 0;
    }
    .chart-col {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; gap: 4px;
      height: 100%; justify-content: flex-end;
      min-width: 0;
    }
    .chart-bar {
      width: 100%;
      background: linear-gradient(to top, var(--primary), color-mix(in oklch, var(--primary) 65%, var(--accent)));
      border-radius: 4px 4px 2px 2px;
      min-height: 3px;
      transition: height 0.4s;
    }
    .chart-bar.empty { background: var(--muted); }
    .chart-label { font-size: 9px; color: var(--muted-foreground); font-weight: 600; }
    .chart-label.today { color: var(--primary); font-weight: 800; }
    .highlight-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; border-radius: 0.75rem;
      background: color-mix(in oklch, var(--muted) 40%, transparent);
      font-size: 0.8125rem; margin-bottom: 6px;
    }
    .highlight-row strong { font-family: var(--font-display); font-weight: 700; }

    .level-card { position: relative; }
    /* Level-up modal */
    .levelup-overlay {
      position: fixed; inset: 0; z-index: 250;
      background: oklch(0 0 0 / 0.7);
      backdrop-filter: blur(6px);
      display: grid; place-items: center;
      padding: 20px;
      animation: fadeIn 0.25s;
      cursor: pointer;
    }
    .levelup-card {
      position: relative;
      background: var(--card);
      border: 1px solid color-mix(in oklch, var(--primary) 40%, var(--border));
      border-radius: 2rem;
      padding: 40px 28px 32px;
      max-width: 340px; width: 100%;
      text-align: center;
      box-shadow: 0 30px 60px oklch(0 0 0 / 0.4);
      animation: levelupPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: default;
      overflow: hidden;
    }
    .levelup-card::before {
      content: "";
      position: absolute;
      inset: -50%;
      background: radial-gradient(circle, color-mix(in oklch, var(--primary) 30%, transparent) 0%, transparent 60%);
      animation: levelupGlow 2.5s ease-in-out infinite;
      pointer-events: none;
    }
    .levelup-content { position: relative; z-index: 1; }
    .levelup-crown {
      width: 44px; height: 44px;
      margin: 0 auto 8px;
      color: var(--accent);
      stroke-width: 2;
      filter: drop-shadow(0 4px 12px color-mix(in oklch, var(--accent) 50%, transparent));
      animation: pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .levelup-label {
      font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--primary);
    }
    .levelup-number {
      font-family: var(--font-display);
      font-size: 5rem; font-weight: 800; line-height: 1;
      margin: 6px 0 4px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .levelup-title {
      font-family: var(--font-display);
      font-size: 1.25rem; font-weight: 700;
      margin-bottom: 20px;
    }
    .levelup-rewards {
      display: flex; justify-content: center; gap: 8px;
      flex-wrap: wrap; margin-bottom: 24px;
    }
    .levelup-rewards span {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 6px 12px; border-radius: 999px;
      background: color-mix(in oklch, var(--xp) 15%, transparent);
      color: var(--xp);
      font-family: var(--font-display);
      font-weight: 700; font-size: 0.8125rem;
    }
    .levelup-rewards span svg { width: 14px; height: 14px; }
    @keyframes levelupPop {
      0% { transform: scale(0.4) translateY(30px); opacity: 0; }
      60% { transform: scale(1.05) translateY(0); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    @keyframes levelupGlow {
      0%, 100% { transform: scale(1); opacity: 0.55; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    /* Toast */
    .toast {
      position: fixed; left: 50%; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--primary);
      color: var(--primary-foreground);
      font-family: var(--font-display);
      font-weight: 700; font-size: 0.875rem;
      padding: 12px 18px; border-radius: 999px;
      box-shadow: var(--shadow-lift);
      z-index: 200;
      animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      max-width: calc(100% - 32px);
      text-align: center;
    }
    .toast > svg, .toast > i {
      width: 16px; height: 16px;
      flex-shrink: 0;
    }
    .toast[hidden] { display: none; }

    .toast.toast-update {
      bottom: auto;
      top: 24px;
      cursor: pointer;
      border: 0;
      font-family: var(--font-display);
    }

    .toast-undo {
      position: fixed; left: 50%; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--foreground);
      color: var(--background);
      font-size: 0.8125rem;
      padding: 10px 10px 10px 18px;
      border-radius: 999px;
      box-shadow: var(--shadow-lift);
      z-index: 260;
      animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      max-width: calc(100% - 32px);
    }
    .toast-undo[hidden] { display: none; }
    .toast-undo-text {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toast-undo-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border: 0;
      border-radius: 999px;
      background: var(--primary);
      color: var(--primary-foreground);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
      transition: transform 0.15s;
      flex-shrink: 0;
    }
    .toast-undo-btn:hover { background: color-mix(in oklch, var(--primary) 90%, white); }
    .toast-undo-btn:active { transform: scale(0.95); }
    .toast-undo-btn svg { width: 12px; height: 12px; }

    .reset-area {
      margin-top: 34px;
      padding-top: 12px;
      text-align: center;
      border-top: 1px solid color-mix(in oklch, var(--border) 55%, transparent);
    }
    .reset-discreet {
      border: 0;
      background: transparent;
      color: var(--muted-foreground);
      font-size: 0.68rem;
      font-weight: 500;
      opacity: 0.5;
      padding: 5px 8px;
      cursor: pointer;
      border-radius: 999px;
      transition: opacity 0.2s, color 0.2s, background 0.2s;
    }
    .reset-discreet:hover {
      opacity: 1;
      color: var(--destructive);
      background: color-mix(in oklch, var(--destructive) 7%, transparent);
    }

    /* Animations */
    @keyframes xp-float {
      0% { opacity: 0; transform: translateY(6px) scale(0.85); }
      25% { opacity: 1; transform: translateY(-4px) scale(1.08); }
      100% { opacity: 0; transform: translateY(-34px) scale(1); }
    }
    @keyframes pop {
      0% { transform: scale(0.85); }
      60% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    @keyframes screen-shake {
      0%, 100% { transform: translate(0, 0); }
      15% { transform: translate(-4px, 2px) rotate(-0.4deg); }
      30% { transform: translate(4px, -3px) rotate(0.4deg); }
      45% { transform: translate(-3px, -3px) rotate(-0.3deg); }
      60% { transform: translate(3px, 3px) rotate(0.3deg); }
      80% { transform: translate(-2px, 1px) rotate(-0.2deg); }
    }
    body.screen-shake {
      animation: screen-shake 0.32s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }

    /* Suppress entry animations on re-renders (tab changes, completions, …) */
    .app.no-enter-anim .chore-card:not(.just-completed),
    .app.no-enter-anim .level-card,
    .app.no-enter-anim .level-number {
      animation: none !important;
    }

    :focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
      border-radius: 0.4rem;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  
    /* ===== Cozy RPG visual recast ===== */
    :root {
      --background: #f5ead6;
      --foreground: #4b3525;
      --card: #fff7e8;
      --card-foreground: #4b3525;
      --primary: #5f8259;
      --primary-foreground: #fffaf0;
      --secondary: #ead7b8;
      --secondary-foreground: #5a3d27;
      --muted: #eadfc9;
      --muted-foreground: #806b58;
      --accent: #d99b36;
      --accent-foreground: #4a321c;
      --destructive: #bd5b4a;
      --destructive-foreground: #fffaf0;
      --border: #d8c09c;
      --input: #ead9bd;
      --ring: #5f8259;
      --xp: #6f9b61;
      --streak: #e07b3f;
      --badge: #9a7650;
      --freeze: #709bb2;
      --positive: #5f8259;
      --negative: #bd5b4a;
      --easy: #6f9b61;
      --medium: #d99b36;
      --hard: #bd5b4a;
      --coins: #d89b22;
      --nav-h: 64px;
      --shadow-soft: 0 4px 0 rgba(112, 78, 39, .08), 0 12px 28px rgba(112, 78, 39, .10);
      --shadow-lift: 0 8px 0 rgba(112, 78, 39, .08), 0 18px 35px rgba(112, 78, 39, .13);
      --shadow-sheet: 0 -20px 60px rgba(112, 78, 39, .15);
      --font-display: "DM Serif Display", Georgia, serif;
      --font-sans: "Nunito", ui-rounded, system-ui, sans-serif;
    }
    html.dark {
      --background: #111713;
      --foreground: #f2eadb;
      --card: #1d261f;
      --card-foreground: #f2eadb;
      --primary: #8fb37f;
      --primary-foreground: #172017;
      --secondary: #2b372e;
      --secondary-foreground: #f2eadb;
      --muted: #273229;
      --muted-foreground: #b9b1a3;
      --accent: #e3ad4b;
      --accent-foreground: #21180d;
      --destructive: #bd5b4a;
      --destructive-foreground: #f2eadb;
      --border: #3d493f;
      --input: #303b33;
      --ring: #8fb37f;
      --xp: #91bd7e;
      --streak: #e07b3f;
      --badge: #9a7650;
      --freeze: #709bb2;
      --positive: #8fb37f;
      --negative: #bd5b4a;
      --easy: #91bd7e;
      --medium: #e3ad4b;
      --hard: #bd5b4a;
      --coins: #efbb4c;
      --nav-h: 64px;
      --shadow-soft: 0 4px 0 rgba(0,0,0,.18), 0 12px 28px rgba(0,0,0,.28);
      --shadow-lift: 0 8px 0 rgba(0,0,0,.20), 0 18px 35px rgba(0,0,0,.34);
      --shadow-sheet: 0 -20px 60px rgba(0,0,0,.45);
    }
    body {
      background:
        radial-gradient(circle at 10% 4%, rgba(255,255,255,.72) 0 2px, transparent 3px),
        radial-gradient(circle at 90% 12%, rgba(125,145,91,.10) 0 45px, transparent 46px),
        linear-gradient(180deg, #f9f0df 0%, var(--background) 100%);
      color: var(--foreground);
    }
    html.dark body {
      background:
        radial-gradient(circle at 10% 4%, rgba(143,179,127,.08) 0 2px, transparent 3px),
        radial-gradient(circle at 90% 12%, rgba(143,179,127,.05) 0 45px, transparent 46px),
        linear-gradient(180deg, #1a211c 0%, #111713 100%);
    }

    /* ---------- Ambient background, soft drift ---------- */
    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      pointer-events: none;
      z-index: -1;
      opacity: .5;
      background:
        radial-gradient(circle at 20% 30%, rgba(95,130,89,.10) 0 60vw, transparent 61vw),
        radial-gradient(circle at 85% 70%, rgba(217,155,54,.08) 0 55vw, transparent 56vw),
        radial-gradient(circle at 55% 15%, rgba(112,123,171,.06) 0 50vw, transparent 51vw);
      animation: ambient-drift 70s ease-in-out infinite alternate;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background-image: radial-gradient(rgba(93,67,39,.13) .7px, transparent .7px);
      background-size: 13px 13px;
      mask-image: linear-gradient(to bottom, black, transparent 80%);
      opacity: .24;
    }
    html.dark body::after {
      opacity: .16;
      background-image: radial-gradient(rgba(143,179,127,.14) .7px, transparent .7px);
    }
    @keyframes ambient-drift {
      0%   { transform: translate(0, 0) rotate(0deg); }
      45%  { transform: translate(2%, -2%) rotate(1.2deg); }
      100% { transform: translate(-2%, 2%) rotate(-1deg); }
    }
    /* Keep .app padding consistent with --nav-h (82px total floor). */
    .app { max-width: 500px; padding: 18px 15px calc(var(--nav-h) + 18px + env(safe-area-inset-bottom, 0px)); }
    .header { margin-bottom: 14px; }
    .cozy-header { align-items: flex-end; }
    .cozy-greeting { font-size: .72rem; font-weight: 800; letter-spacing: .04em; color: var(--muted-foreground); text-transform: none; margin-bottom: 2px; }
    .brand h1 { font-family: var(--font-display); font-size: 1.7rem; font-weight: 400; letter-spacing: -.025em; }
    .brand-sprig { color: var(--primary); font-size: 1rem; vertical-align: middle; }
    .header-actions { gap: 7px; }
    .header-coins {
      display: inline-flex; align-items: center; gap: 5px; padding: 8px 11px;
      border-radius: 999px; background: #fff0c9; border: 1px solid #e1b861; color: #8c5b16;
      font-family: var(--font-display); font-size: .92rem; box-shadow: 0 3px 0 rgba(112,78,39,.08);
    }
    .header-coins svg { width: 16px; height: 16px; }
    .icon-btn { background: rgba(255,247,232,.75); border-color: var(--border); box-shadow: 0 3px 0 rgba(112,78,39,.06); }
    .quest-intro { margin: 8px 2px 13px; }
    .quest-intro h2 { font-size: 1.7rem; font-weight: 400; }
    .quest-intro p { color: var(--muted-foreground); font-size: .88rem; margin-top: 2px; }
    .card, .stat-card, .highlight-row, .badges-summary, .badge-chain, .reward-card, .cosmetic-card {
      background: rgba(255,247,232,.88); border: 1px solid var(--border); box-shadow: var(--shadow-soft); border-radius: 1.25rem;
    }
    .level-card { padding: 19px; border-radius: 1.5rem; position: relative; overflow: hidden; }
    .level-card::after {
      content: ""; position: absolute; width: 150px; height: 150px; right: -70px; top: -80px;
      background: radial-gradient(circle, rgba(95,130,89,.16), transparent 68%); pointer-events: none;
    }
    .level-label { font-family: var(--font-sans); text-transform: none; letter-spacing: .03em; font-size: .72rem; color: var(--muted-foreground); }
    .level-number { color: var(--primary); font-size: 4rem; text-shadow: 2px 2px 0 rgba(95,130,89,.10); }
    .level-title-inline { color: var(--foreground); font-family: var(--font-display); font-weight: 400; font-size: 1.2rem; }
    .level-total .xp-next { color: var(--primary); font-weight: 800; }
    .xp-bar { height: 13px; background: #dfceb0; border: 1px solid #cbb28c; }
    .xp-bar-fill { background: linear-gradient(90deg, #759d65, #9fbd6f); }
    .ring-block { background: #f0e3cb; border: 1px solid #dcc39d; }
    .ring-wrap circle:nth-child(2) { stroke: var(--primary); }
    .dash-stats { gap: 9px; }
    .dash-stat { background: #f7ead4; border: 1px solid #ddc5a0; border-radius: 1rem; }
    .section-title, .stats-subtitle { font-family: var(--font-display); font-weight: 400; }
    .tabs { background: #eadcc4; border: 1px solid #d7bd96; border-radius: 999px; padding: 4px; }
    .tab { border-radius: 999px; }
    .tab.active, .filter-chip.active { background: var(--primary); color: #fffaf0; }
    .filter-row { gap: 6px; }
    .filter-chip { border-color: #d6bd98; background: rgba(255,247,232,.7); border-radius: 999px; }
    .chore-group-title { font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; }
    .chore-card {
      background: rgba(255,248,234,.88); border-color: #dcc49e; border-radius: 1rem;
      box-shadow: 0 3px 0 rgba(112,78,39,.05), 0 6px 16px rgba(112,78,39,.06);
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.3s, border-color 0.2s;
    }
    .chore-card.done {
      opacity: 0.55;
      background: rgba(253,243,224,.55);
      border-color: #d6c39a;
      box-shadow: 0 2px 0 rgba(112,78,39,.03), 0 4px 10px rgba(112,78,39,.04);
    }
    .chore-card:not(.done):hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 0 rgba(112,78,39,.06), 0 10px 24px rgba(112,78,39,.10);
      border-color: #c9b88a;
    }
    .chore-card:not(.done):active {
      transform: translateY(0);
      box-shadow: 0 2px 0 rgba(112,78,39,.05);
    }
    .chore-btn { background: #f4e5cb; border-color: #cbb28d; color: var(--foreground); }
    .chore-btn:not(.ghost) { border-color: #bca57f; }
    .chore-btn.ghost { background: transparent; }
    .chore-btn[data-action="complete-chore"] { background: #f1dfbf; }
    .fab { width: 58px; height: 58px; border-radius: 20px; background: var(--primary); box-shadow: 0 6px 0 #456442, 0 14px 24px rgba(65,96,57,.22); }
    .fab:active { transform: translateY(3px); box-shadow: 0 3px 0 #456442; }
    .bottom-nav { background: rgba(255,247,232,.94); border-top: 1px solid #d6bd98; box-shadow: 0 -8px 24px rgba(112,78,39,.08); }
    .bottom-nav-item { font-size: .68rem; color: #8b765f; }
    .bottom-nav-item.active { color: var(--primary); }
    .bottom-nav-item.active .bottom-nav-icon { background: #dce9d2; box-shadow: inset 0 0 0 1px #b8cfac; }
    .bottom-nav-icon { width: 52px; height: 31px; border-radius: 13px; }
    .toast { background: #5f8259; border: 1px solid #4c6f48; }
    .levelup-overlay { background: rgba(67,52,35,.62); backdrop-filter: blur(5px); }
    .levelup-card { background: #fff4dd; border-color: #d9b979; box-shadow: 0 10px 0 rgba(87,61,31,.12), 0 30px 60px rgba(57,40,24,.25); }
    .levelup-label { color: var(--primary); }
    .levelup-number { background: none; color: var(--primary); -webkit-text-fill-color: initial; }
    .btn-primary { background: var(--primary); border-radius: 14px; box-shadow: 0 4px 0 #456442; }
    .btn-primary:active { transform: translateY(2px); box-shadow: 0 2px 0 #456442; }
    .btn-ghost, .btn-outline { border-color: var(--border); background: rgba(255,247,232,.65); border-radius: 12px; }
    .sheet { background: #fff4df; border-color: var(--border); }
    .sheet-overlay { background: rgba(67,52,35,.45); }

    /* Dark mode: every surface follows the dark palette, not the light parchment defaults. */
    html.dark .card,
    html.dark .stat-card,
    html.dark .highlight-row,
    html.dark .badges-summary,
    html.dark .badge-chain,
    html.dark .reward-card,
    html.dark .cosmetic-card,
    html.dark .chore-card,
    html.dark .level-card {
      background: #1d261f;
      border-color: #3d493f;
      color: var(--card-foreground);
    }
    html.dark .dash-stat,
    html.dark .ring-block {
      background: #242e26;
      border-color: #3d493f;
    }
    html.dark .tabs {
      background: #242e26;
      border-color: #3d493f;
    }
    html.dark .filter-chip,
    html.dark .btn-ghost,
    html.dark .btn-outline {
      background: #242e26;
      border-color: #3d493f;
      color: var(--foreground);
    }
    html.dark .chore-btn,
    html.dark .chore-btn[data-action="complete-chore"] {
      background: #2a352c;
      border-color: #465448;
      color: var(--foreground);
    }
    html.dark .xp-bar {
      background: #303b32;
      border-color: #465448;
    }
    html.dark .header-coins {
      background: #3a2d14;
      border-color: #806327;
      color: #f2c45c;
    }
    html.dark .icon-btn {
      background: #202a22;
      border-color: #3d493f;
    }
    html.dark .bottom-nav {
      background: rgba(24,31,26,.96);
      border-top-color: #3d493f;
      box-shadow: 0 -8px 24px rgba(0,0,0,.28);
    }
    html.dark .bottom-nav-item { color: #a9a396; }
    html.dark .bottom-nav-item.active .bottom-nav-icon {
      background: #2f4433;
      box-shadow: inset 0 0 0 1px #506a52;
    }
    html.dark .levelup-card {
      background: #1d261f;
      border-color: #526050;
      box-shadow: 0 10px 0 rgba(0,0,0,.25), 0 30px 60px rgba(0,0,0,.45);
    }
    html.dark .sheet {
      background: #1d261f;
      border-color: #3d493f;
    }
    html.dark .btn-ghost,
    html.dark .btn-outline {
      background: #202a22;
    }
    @media (max-width: 420px) {
      .brand h1 { font-size: 1.5rem; } .quest-intro h2 { font-size: 1.5rem; }
      .header-coins { padding: 7px 9px; }
    }

</style>

<body>
  <main class="app" id="app"></main>
  <div id="sheet-root"></div>
  <div id="modal-root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
  <div class="toast-undo" id="toast-undo" role="status" aria-live="polite" aria-atomic="true" hidden>
    <span class="toast-undo-text" id="toast-undo-text"></span>
    <button class="toast-undo-btn" id="toast-undo-btn" type="button">
      <i data-lucide="undo-2"></i><span>Undo</span>

      const ownedParticles = Array.isArray(inCos.ownedParticles) ? inCos.ownedParticles.filter((id) => COSMETIC_PARTICLES.some((p) => p.id === id)) : [];

        ownedThemes: Array.from(new Set(["default", ...ownedThemes])),
        ownedFrames: Array.from(new Set(["none", ...ownedFrames])),
        ownedParticles: Array.from(new Set(["default", ...ownedParticles])),
        equipped: {
          theme: typeof inCos.equipped?.theme === "string" && (ownedThemes.includes(inCos.equipped.theme) || inCos.equipped.theme === "default") ? inCos.equipped.theme : "default",
          frame: typeof inCos.equipped?.frame === "string" && (ownedFrames.includes(inCos.equipped.frame) || inCos.equipped.frame === "none") ? inCos.equipped.frame : "none",

    const Voice = (function () {
      const lastPick = {};
      function pick(category, arr) {
        if (!arr || !arr.length) return "";
        if (arr.length === 1) return arr[0];
        let line, tries = 0;
        do {
          line = arr[(Math.random() * arr.length) | 0];

        lastPick[category] = line;
        return line;

    function applyCosmeticTheme() {

    /* ============================================================
       Particle system
       ============================================================ */
    function burstParticles(options = {}) {
      if (prefersReducedMotion()) return;
      const {
        count = 60,
        colors = ["#f59e0b", "#10b981", "#3b82f6", "#ec4899", "#8b5cf6"],
        speedMin = 3,
        speedMax = 10,
        sizeMin = 4,
        sizeMax = 9,
        duration = 1800,
        gravity = 0.4,
        originX = 0.5,
        originY = 0.35,
        shape = "rect",
      } = options;
      try {
        const canvas = document.createElement("canvas");
        canvas.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:300;";
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        document.body.appendChild(canvas);
        const ctx = canvas.getContext("2d");
        const particles = [];
        const cx = canvas.width * originX;
        const cy = canvas.height * originY;
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = (speedMin + Math.random() * (speedMax - speedMin)) * dpr;
          particles.push({
            x: cx, y: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 4 * dpr,
            size: (sizeMin + Math.random() * (sizeMax - sizeMin)) * dpr,
            color: colors[(Math.random() * colors.length) | 0],
            rot: Math.random() * Math.PI,
            vr: (Math.random() - 0.5) * 0.35,
            shape,
          });
        }
        const start = performance.now();
        function frame(t) {
          const p = Math.min(1, (t - start) / duration);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          for (const pt of particles) {
            pt.vy += gravity * dpr;
            pt.x += pt.vx;
            pt.y += pt.vy;
            pt.vx *= 0.99;
            pt.rot += pt.vr;
            ctx.save();
            ctx.globalAlpha = 1 - p;
            ctx.translate(pt.x, pt.y);
            ctx.rotate(pt.rot);
            ctx.fillStyle = pt.color;
            if (pt.shape === "circle") {
              ctx.beginPath();
              ctx.arc(0, 0, pt.size / 2, 0, Math.PI * 2);
              ctx.fill();
            } else if (pt.shape === "spark") {
              ctx.beginPath();
              ctx.moveTo(0, -pt.size);
              ctx.lineTo(pt.size * 0.4, 0);
              ctx.lineTo(0, pt.size);
              ctx.lineTo(-pt.size * 0.4, 0);
              ctx.closePath();
              ctx.fill();
            } else {
              ctx.fillRect(-pt.size / 2, -pt.size / 2, pt.size, pt.size * 0.6);
            }
            ctx.restore();
          }
          if (p < 1) requestAnimationFrame(frame);
          else canvas.remove();
        }
        requestAnimationFrame(frame);
      } catch {}
    }

    /* ---------- Ambient particles (background atmosphere) ---------- */
    const ambientParticleCtx = (function () {
      let canvas = null;
      let ctx = null;
      let particles = [];
      let rafId = null;
      let running = false;
      let palette = ["#fef3c7", "#fcd34d", "#759d65", "#dce9d2", "#e3ad4b"];
      const COUNT = 12;
      const GRAVITY = -0.04;
      const SPEED_MIN = 0.15;
      const SPEED_MAX = 0.5;
      const SIZE_MIN = 2;
      const SIZE_MAX = 4.5;
      const LIFE_MIN = 25000;
      const LIFE_MAX = 55000;

      function ensureCanvas() {
        if (canvas) return;
        try {
          canvas = document.createElement("canvas");
          canvas.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:5;mix-blend-mode:multiply;";
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = window.innerWidth * dpr;
          canvas.height = window.innerHeight * dpr;
          canvas.style.width = "100%";
          canvas.style.height = "100%";
          canvas.style.opacity = "0.5";
          document.body.appendChild(canvas);
          ctx = canvas.getContext("2d");
          ctx.scale(dpr, dpr);
        } catch {}
      }

      function pickPalette() {
        try {
          const themeId = (state && state.cosmetics?.equipped?.theme) || "default";
          const theme = COSMETIC_THEMES.find((t) => t.id === themeId);
          if (theme && theme.vars) {
            const vars = ui.dark ? theme.vars.dark : theme.vars.light;
            if (vars && vars["--primary"]) {
              palette = [vars["--primary"], vars["--accent"] || vars["--primary"], 
                "#fef3c7", "#fcd34d", "#dce9d2"];
            }
          }
        } catch {}
      }

      function spawn() {
        ensureCanvas();
        if (!ctx || ui.muted) return;
        pickPalette();
        const w = window.innerWidth;
        const h = window.innerHeight;
        for (let i = 0; i < COUNT; i++) {
          const existing = particles.find(p => !p.dead);
          if (existing) {
            existing.x = Math.random() * w;
            existing.y = h + 20 + Math.random() * 40;
            existing.vy = -(SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN));
            existing.vx = (Math.random() - 0.5) * 0.2;
            existing.size = SIZE_MIN + Math.random() * (SIZE_MAX - SIZE_MIN);
            existing.color = palette[Math.floor(Math.random() * palette.length)];
            existing.life = LIFE_MIN + Math.random() * (LIFE_MAX - LIFE_MIN);
            existing.dead = false;
            existing.wobble = Math.random() * Math.PI * 2;
            existing.wobbleSpeed = 0.01 + Math.random() * 0.02;
          } else {
            particles.push({
              x: Math.random() * w,
              y: h + 20 + Math.random() * 40,
              vx: (Math.random() - 0.5) * 0.2,
              vy: -(SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN)),
              size: SIZE_MIN + Math.random() * (SIZE_MAX - SIZE_MIN),
              color: palette[Math.floor(Math.random() * palette.length)],
              life: LIFE_MIN + Math.random() * (LIFE_MAX - LIFE_MIN),
              born: performance.now(),
              dead: false,
              wobble: Math.random() * Math.PI * 2,
              wobbleSpeed: 0.01 + Math.random() * 0.02,
            });
          }
        }
      }

      function frame(now) {
        if (!ctx || !running) return;
        const w = window.innerWidth;
        const h = window.innerHeight;
        ctx.clearRect(0, 0, w, h);
        const elapsed = now - (ambientParticleCtx._lastFrame || now);
        ambientParticleCtx._lastFrame = now;

        for (const p of particles) {
          if (p.dead) continue;
          const age = now - p.born;
          if (age > p.life || p.y < -20) {
            p.dead = true;
            continue;
          }
          p.wobble += p.wobbleSpeed;
          p.vx += Math.sin(p.wobble) * 0.003;
          p.x += p.vx * elapsed * 0.06;
          p.y += p.vy * elapsed * 0.06;
          p.vy += GRAVITY * elapsed * 0.06;
          const alpha = Math.min(1, (p.life - age) / 8000) * 0.5;
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        rafId = requestAnimationFrame(frame);
      }

      function start() {
        if (running) return;
        if (prefersReducedMotion()) return;
        if (ui.muted) return;
        running = true;
        ambientParticleCtx._lastFrame = performance.now();
        spawn();
        rafId = requestAnimationFrame(frame);
      }

      function stop() {
        running = false;
        if (rafId) cancelAnimationFrame(rafId);
        rafId = null;
        if (canvas) {
          canvas.remove();
          canvas = null;
          ctx = null;
        }
        particles = [];
      }

      function refresh() {
        if (!running) return;
        particles.forEach(p => { p.dead = true; });
        spawn();
      }

      return { start, stop, refresh, ensureCanvas, pickPalette };
    })();

    function startAmbientParticles() {
      ambientParticleCtx.start();
    }

    function stopAmbientParticles() {
      ambientParticleCtx.stop();

    /* ============================================================

    let audioCtx = null;

    function getAudioCtx() {
      if (audioCtx) return audioCtx;
      try {
        const Ctor = window.AudioContext || window.webkitAudioContext;
        if (!Ctor) return null;
        audioCtx = new Ctor();
      } catch { audioCtx = null; }
      return audioCtx;
    }

    function ensureAudioRunning() {
      const ctx = getAudioCtx();
      if (!ctx) return null;
      if (ctx.state === "suspended") ctx.resume().catch(() => {});
      return ctx;
    }

    function playTone({ freq, freqEnd, duration = 0.15, type = "sine", gain = 0.08, delay = 0 }) {
      if (ui.muted) return;
      const ctx = ensureAudioRunning();
      if (!ctx) return;
      const t0 = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (freqEnd && freqEnd !== freq) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t0 + duration);
      }
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(gain, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
      osc.connect(g).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + duration + 0.02);
    }

    /* Notifications */
    const notifSupported = typeof window !== "undefined" && "Notification" in window;

    function notify(title, options = {}) {
      if (!notifActive()) return null;

          badge: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2340a88b'/%3E%3C/svg%3E",
          silent: options.silent === true,

        n.onclick = () => { try { window.focus(); n.close(); } catch {} };

    async function requestNotificationPermission() {
      if (!notifSupported) {
        showToast("Notifications aren't supported in this browser.", "bell-off");
        return "unsupported";

      let perm = Notification.permission;
      if (perm !== "granted" && perm !== "denied") {
        try { perm = await Notification.requestPermission(); } catch { perm = Notification.permission; }
      }
      if (perm === "granted") {
        notifPrefs.enabled = true;
        saveNotifPrefs();

    /* ============================================================
       Reminder composer — chooses a time-appropriate voice,
       names the biggest pending quest, and quietly skips late
       nights so it never feels like an alarm clock.
       ============================================================ */
    function buildReminder() {
      const now = new Date();
      const hour = now.getHours();
      const dow = now.getDay();

      // Quiet hours: 22:00 – 07:00. The user asked for a nudge,
      // not a wake-up call.
      if (hour >= 22 || hour < 7) return null;

      const pending = state.chores.filter((c) => !c.completedAt);
      if (pending.length === 0) return null;

      const n = pending.length;
      const pendingWord = n === 1 ? "quest" : "quests";
      const streak = state.streak;
      const hasStreak = streak > 0;
      const startedToday = (state.completionsLog?.[dayKey()] || 0) > 0;
      const isFriday = dow === 5;
      const isWeekend = dow === 0 || dow === 6;

      // Headline quest: the biggest still on the board.
      const biggest = [...pending].sort((a, b) => b.xp - a.xp)[0];

      const isMorning   = hour < 11;
      const isAfternoon = hour >= 11 && hour < 17;
      const isEvening   = hour >= 17 && hour < 21;
      const isLastCall  = hour >= 21;

      let title, body;

      if (isLastCall && hasStreak && !startedToday) {
        title = Voice.pick("lastcall.title", [
          `⏳ ${streak} days on the line`,
          "Last call for today",
          `Don't let ${streak} days fade out`,
          "One quest, and today is saved",
        ]);
        body = Voice.pick("lastcall.body", [
          `${n} ${pendingWord} left — even a small one keeps the chain going.`,
          `${biggest.name} is still waiting. It would save your streak.`,
          `${n} ${pendingWord}. Then today is yours.`,
        ]);
      } else if (isLastCall && hasStreak && startedToday) {
        title = Voice.pick("lastcallstarted.title", [
          `🔥 ${streak} days — you're nearly done`,
          "Home stretch",
          "Almost there",
        ]);
        body = Voice.pick("lastcallstarted.body", [
          `${n} ${pendingWord} left. Finish what you started.`,
          `You already showed up today. ${n} ${pendingWord} to close out.`,
        ]);
      } else if (isLastCall) {
        title = Voice.pick("lastcallfresh.title", [
          "A small win before bed?",
          "The day isn't over yet",
          "One quest to start something",
        ]);
        body = Voice.pick("lastcallfresh.body", [
          `${biggest.name} is right there — a gentle place to begin.`,
