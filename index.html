    /* Focus trap */
    let lastFocusedBeforeDialog = null;

    function getActiveDialog() {
      return sheetRoot.querySelector(".sheet")
        || modalRoot.querySelector(".levelup-card")
        || document.querySelector(".confirm-overlay .levelup-card");
    }

    function trapFocus(e) {
      if (e.key !== "Tab") return;
      const dialog = getActiveDialog();
      if (!dialog) return;

      const focusables = Array.from(
        dialog.querySelectorAll(
          "button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex='-1'])"
        )
      ).filter((el) => el.offsetParent !== null || el === document.activeElement);

      if (focusables.length === 0) {
        e.preventDefault();
        return;
      }

      const first = focusables[0];
      const last = focusables[focusables.length - 1];
      const active = document.activeElement;

      if (e.shiftKey && active === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && active === last) {
        e.preventDefault();
        first.focus();
      }
    }

    /* Render */
    let hasRenderedOnce = false;
    function render() {
      const focusId = document.activeElement?.id || null;
      const selStart = document.activeElement?.selectionStart ?? null;
      const selEnd = document.activeElement?.selectionEnd ?? null;

      app.innerHTML = buildApp();

      if (hasRenderedOnce) app.classList.add("no-enter-anim");
      else hasRenderedOnce = true;

      /* Add-chore is the only remaining sheet */
      sheetRoot.innerHTML = ui.addChoreOpen ? buildAddChoreSheet() : "";

      const modalSig = ui.levelUpModal
        ? `lvl-${ui.levelUpModal.level}-${ui.levelUpModal.bonusXp}-${ui.levelUpModal.coins}`
        : "none";
      if (modalSig !== lastModalSig) {
        modalRoot.innerHTML = ui.levelUpModal ? buildLevelUpModal(ui.levelUpModal) : "";
        lastModalSig = modalSig;
      }

      const anySheetOpen = ui.addChoreOpen || !!ui.levelUpModal || !!document.querySelector(".confirm-overlay");
      document.body.classList.toggle("sheet-open", anySheetOpen);

      const dialogEl = getActiveDialog();
      if (dialogEl) {
        dialogEl.setAttribute("role", "dialog");
        dialogEl.setAttribute("aria-modal", "true");

        if (!lastFocusedBeforeDialog) {
          lastFocusedBeforeDialog = document.activeElement;
        }

        if (!dialogEl.contains(document.activeElement)) {
          const firstFocusable = dialogEl.querySelector(
            "button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex='-1'])"
          );
          (firstFocusable || dialogEl).focus?.();
        }
      } else if (lastFocusedBeforeDialog) {
        if (lastFocusedBeforeDialog !== document.body) {
          try { lastFocusedBeforeDialog.focus?.(); } catch {}
        }
        lastFocusedBeforeDialog = null;
      }

      if (focusId) {
        const el = document.getElementById(focusId);
        if (el && typeof el.focus === "function" && (!dialogEl || dialogEl.contains(el))) {
          el.focus();
          if (selStart != null && typeof el.setSelectionRange === "function") {
            try { el.setSelectionRange(selStart, selEnd); } catch {}
          }
        }
      }

      if (window.lucide) window.lucide.createIcons();
    }

    /* ============================================================
       CHORES VIEW
       ============================================================ */
    function buildChoresView() {

    function buildLevelCard(level) {
      const total = state.chores.length;
      const done = state.chores.filter((c) => c.completedAt).length;
      const pct = total === 0 ? 0 : (done / total) * 100;
      const weekly = state.chores.filter((c) => c.frequency === "weekly");
      const monthly = state.chores.filter((c) => c.frequency === "monthly");
      const weeklyDone = weekly.filter((c) => c.completedAt).length;
      const monthlyDone = monthly.filter((c) => c.completedAt).length;

      const radius = 26;
      const circ = 2 * Math.PI * radius;
      const offset = circ - (Math.min(100, Math.max(0, pct)) / 100) * circ;

      const badgesUnlocked = countUnlockedTiers();
      const badgesTotal = countTotalTiers();
      const badgesPct = Math.round((badgesUnlocked / badgesTotal) * 100);
      const streakLabel = state.streak === 1 ? "day" : "days";
      const bestStreakLabel = state.bestStreak === 1 ? "day" : "days";

      return `
        <section class="card level-card">

          <div class="level-head">
            <div>
              <p class="level-label">Current level</p>
              <div class="level-number-row">
                <p class="level-number">${level.level}</p>
                <p class="level-title-inline">${esc(levelTitle(level.level))}</p>
              </div>
            </div>
            <div class="level-total">
              <p class="xp-next">${level.xpToNext} XP to level ${level.level + 1}</p>
            </div>
          </div>
          <div class="xp-bar"><div class="xp-bar-fill" style="width:${level.progress}%"></div></div>
          <p class="xp-caption">${level.xpIntoLevel} / ${level.xpForLevel} XP this level</p>

          <div class="ring-block">
            <div class="ring-wrap">
              <svg viewBox="0 0 64 64">
                <circle cx="32" cy="32" r="${radius}" fill="none" stroke="var(--border)" stroke-width="7"/>
                <circle cx="32" cy="32" r="${radius}" fill="none" stroke="var(--primary)" stroke-width="7"
                  stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"
                  style="transition: stroke-dashoffset 700ms cubic-bezier(0.22,1,0.36,1);"/>
              </svg>
              <span class="ring-value">${Math.round(pct)}%</span>
            </div>
            <div class="ring-text">
              <p class="ring-title">All chores</p>
              <p class="ring-caption">${done}/${total} · ${weeklyDone}/${weekly.length} weekly · ${monthlyDone}/${monthly.length} monthly</p>
            </div>
          </div>

          <div class="dash-stats">
            <div class="dash-stat streak" title="Current streak — best: ${state.bestStreak} ${bestStreakLabel}">
              <span class="dash-stat-icon">${icon("flame")}</span>
              <div class="dash-stat-info">
                <p class="dash-stat-value">${state.streak}<span class="unit">${streakLabel}</span></p>
                <p class="dash-stat-label">Streak</p>
              </div>
              ${state.freezes > 0 ? `<span class="dash-stat-extra" title="Streak freeze available">${icon("snowflake")}${state.freezes}</span>` : ""}
            </div>
            <button type="button" class="dash-stat badges clickable"
              data-action="set-nav-tab" data-nav-tab="badges"
              aria-label="View all badges (${badgesUnlocked} of ${badgesTotal} unlocked)"
              title="${badgesUnlocked} of ${badgesTotal} tiers unlocked — tap to view">
              <span class="dash-stat-icon">${icon("award")}</span>
              <div class="dash-stat-info">
                <p class="dash-stat-value">${badgesUnlocked}<span class="unit">/ ${badgesTotal}</span></p>
                <p class="dash-stat-label">Badges</p>
                <div class="dash-badge-progress">
                  <div class="dash-badge-progress-fill" style="width:${badgesPct}%"></div>
                </div>
              </div>
            </button>
          </div>
        </section>
      `;
    }

    function buildChoresSection() {
      const tab = ui.choreTab;
      const filter = ui.choreFilter;

      const tabList = state.chores.filter((c) => c.frequency === tab);
      const pending = tabList.filter((c) => !c.completedAt);
      const done = tabList.filter((c) => c.completedAt);
      const remainingXp = pending.reduce((sum, c) => sum + c.xp, 0);

      const counts = { all: tabList.length, pending: pending.length, done: done.length };

      let visible;
      if (filter === "pending") visible = pending;
      else if (filter === "done") visible = done;
      else visible = tabList;

      const sorted = [...visible].sort((a, b) => {
        if (Boolean(a.completedAt) !== Boolean(b.completedAt)) return a.completedAt ? 1 : -1;
        return b.xp - a.xp;
      });

      const groups = new Map();
      for (const c of sorted) {
        if (!groups.has(c.category)) groups.set(c.category, []);
        groups.get(c.category).push(c);
      }

      let groupsHtml = "";
      if (groups.size === 0) {
        let emptyIcon = "list-todo";
        let emptyText = "No chores yet. Tap the + button to add one.";
        if (filter === "pending" && tabList.length > 0) { emptyIcon = "party-popper"; emptyText = "All done — nothing left in this tab!"; }
        else if (filter === "done" && tabList.length > 0) { emptyIcon = "circle-dashed"; emptyText = "No chores completed yet in this tab."; }
        groupsHtml = `
          <div class="empty">
            <div class="empty-icon">${icon(emptyIcon)}</div>
            <p>${esc(emptyText)}</p>
          </div>
        `;
      } else {
        for (const [category, chores] of groups.entries()) {
          groupsHtml += `
            <h3 class="category-title">
              <i data-lucide="${catIcon(category)}" class="cat-icon"></i>
              ${esc(category)}
            </h3>
            <div class="chore-list">${chores.map(buildChoreCard).join("")}</div>
          `;
        }
      }

      const filters = [
        { id: "all", label: "All", icon: "layers" },
        { id: "pending", label: "To do", icon: "circle-dashed" },
        { id: "done", label: "Done", icon: "check-check" },
      ];

      return `
        <section class="section">
          <div class="tabs-row">
            <div class="tabs">
              ${["weekly", "monthly"].map((f) => `
                <button class="tab ${ui.choreTab === f ? "active" : ""}"
                  data-action="set-chore-tab" data-chore-tab="${f}">
                  ${f === "weekly" ? "Weekly" : "Monthly"}
                </button>
              `).join("")}
            </div>
            <span class="chores-summary">${pending.length} left · ${remainingXp} XP</span>
          </div>

          <div class="filter-row">
            ${filters.map((f) => `
              <button type="button" class="filter-chip ${filter === f.id ? "active" : ""}"
                data-action="set-filter" data-filter="${f.id}">
                ${icon(f.icon)}
                <span>${f.label}</span>
                <span class="filter-count">${counts[f.id]}</span>
              </button>
            `).join("")}
          </div>

          <div class="chore-groups">${groupsHtml}</div>
        </section>
      `;
    }

    function buildChoreCard(chore) {
      const done = Boolean(chore.completedAt);
      const burst = ui.burstId === chore.id;
      const undoBurst = ui.undoBurstId === chore.id;

              <span class="chip">${esc(chore.frequency)}</span>

          <div class="chore-actions">

            ${undoBurst ? `<span class="xp-float negative">−${chore.xp} XP</span>` : ""}
            <span class="chore-xp">+${chore.xp}</span>
            ${done
              ? `<button class="chore-btn ghost undo-hover" data-action="undo-complete-chore" data-id="${safeId}"
                   aria-label="Undo completion of ${esc(chore.name)}" title="Undo completion">${icon("undo-2")}</button>`
              : `<button class="chore-btn" data-action="complete-chore" data-id="${safeId}"

            <button class="chore-btn ghost delete-hover" data-action="delete-chore" data-id="${safeId}"

    /* ============================================================
       STATS VIEW
       ============================================================ */
    function buildStatsView() {
      const days = [];
      let maxXp = 1;
      for (let i = 13; i >= 0; i--) {
        const key = dateKeyOffset(-i);
        const xp = state.xpLog[key] || 0;
        if (xp > maxXp) maxXp = xp;
        days.push({ key, xp, isToday: i === 0 });
      }

      const chartHtml = days.map((d) => {
        const h = d.xp === 0 ? 0 : Math.max(6, (d.xp / maxXp) * 100);
        const label = d.key.slice(8);
        return `
          <div class="chart-col" title="${d.key} — ${d.xp} XP">
            <div class="chart-bar ${d.xp === 0 ? "empty" : ""}" style="height:${h}%"></div>
            <span class="chart-label ${d.isToday ? "today" : ""}">${label}</span>
          </div>
        `;
      }).join("");

            </div>
          </div>

      `;

      const chainsHtml = BADGE_CHAINS.map(buildBadgeChain).join("");

      return `
        <section>
          ${summary}
          <div class="chain-list">${chainsHtml}</div>
        </section>
      `;
    }

    function buildBadgeChain(chain) {
      const prog = chainProgress(chain);
      const { value, unlockedCount, totalTiers, isMaxed, nextTier, currentTier, progressPct } = prog;

      let subHtml;
      if (isMaxed) {
        subHtml = `<strong>${esc(chain.formatValue(value))}</strong> — all tiers unlocked!`;
      } else if (currentTier) {
        const remaining = nextTier.threshold - value;
        subHtml = `<strong>${esc(currentTier.name)}</strong> · ${esc(chain.formatValue(value))} · ${remaining} to next`;
      } else {
        const remaining = nextTier.threshold - value;
        subHtml = `Next: <strong>${esc(nextTier.name)}</strong> · ${remaining} to go`;
      }

      const dotsHtml = chain.tiers.map((_, i) => {
        const filled = i < unlockedCount;
        const current = i === unlockedCount && !isMaxed;
        const cls = `tier-dot${filled ? " filled" : ""}${current ? " current" : ""}`;
        const tier = chain.tiers[i];
        return `<span class="${cls}" title="${esc(tier.name)} — ${esc(tier.hint)}"></span>`;
      }).join("");

      return `
        <div class="badge-chain ${isMaxed ? "maxed" : ""}" data-chain="${esc(chain.id)}">
          <div class="chain-head">
            <span class="chain-icon">${icon(chain.icon)}</span>
            <div class="chain-info">
              <p class="chain-name">${esc(chain.name)}</p>
              <p class="chain-sub">${subHtml}</p>
            </div>
            <span class="chain-count">${unlockedCount}/${totalTiers}</span>
          </div>
          <div class="chain-bar">
            <div class="chain-fill" style="width:${progressPct}%"></div>
          </div>
          <div class="chain-tiers">${dotsHtml}</div>
        </div>
      `;
    }

    /* Toasts */
    function showToast(text, iconName = "sparkles") {
      toastEl.innerHTML = `<i data-lucide="${iconName}"></i><span>${esc(text)}</span>`;
      toastEl.hidden = false;
      if (window.lucide) window.lucide.createIcons();
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toastEl.hidden = true; toastTimer = null; }, 2400);
    }

    function showUpdateToast(worker) {
      const el = document.createElement("button");
      el.type = "button";
      el.className = "toast toast-update";
      el.innerHTML = `<i data-lucide="refresh-cw"></i><span>Update available — tap to reload</span>`;
      el.addEventListener("click", () => {
        try { worker.postMessage({ type: "SKIP_WAITING" }); } catch {}
      });
      document.body.appendChild(el);
      if (window.lucide) window.lucide.createIcons();
    }
    window.chorequest = { showUpdateToast };

    function showUndoToast(text, duration = 5000) {
      undoToastText.textContent = text;
      undoToastEl.hidden = false;
      if (window.lucide) window.lucide.createIcons();
      if (undoTimer) clearTimeout(undoTimer);
      undoTimer = setTimeout(() => {
        undoToastEl.hidden = true;
        undoTimer = null;
        pendingUndo = null;
      }, duration);
    }

    function hideUndoToast() {
      if (undoTimer) { clearTimeout(undoTimer); undoTimer = null; }
      undoToastEl.hidden = true;
    }

    function performUndo() {
      if (!pendingUndo || pendingUndo.type !== "delete") return;
      const { chore, index } = pendingUndo;
      pendingUndo = null;
      hideUndoToast();

      const newChores = [...state.chores];
      const insertAt = Math.min(Math.max(0, index), newChores.length);
      newChores.splice(insertAt, 0, chore);
      state = { ...state, chores: newChores };
      saveState(state);
      haptic(15);
      render();
    }

    function exportData() {
      try {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `chorequest-backup-${dayKey()}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast("Backup downloaded", "download");
      } catch {
        showToast("Couldn't export data", "alert-triangle");
      }
    }

    function importData() {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = "application/json,.json";
      input.onchange = async () => {
        const file = input.files && input.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          const validated = validateState(data);
          if (!validated) throw new Error("bad shape");
          state = validated;
          saveState(state);
          applyCosmeticTheme();
          haptic(15);
          render();
          showToast("Backup restored", "upload");
        } catch {
          showToast("Couldn't read that file", "alert-triangle");
        }
      };
      input.click();
    }

    function applyTheme() {
      document.documentElement.classList.toggle("dark", ui.dark);
      try { localStorage.setItem(THEME_KEY, ui.dark ? "dark" : "light"); } catch {}
      applyCosmeticTheme();
    }

    /* ============================================================
       Cosmetics actions
       ============================================================ */
    function findCosmetic(kind, id) {
      if (kind === "theme") return COSMETIC_THEMES.find((x) => x.id === id);
      if (kind === "frame") return COSMETIC_FRAMES.find((x) => x.id === id);
      if (kind === "particles") return COSMETIC_PARTICLES.find((x) => x.id === id);
      return null;
    }

    function ownListFor(kind) {
      if (kind === "theme") return state.cosmetics.ownedThemes;
      if (kind === "frame") return state.cosmetics.ownedFrames;
      if (kind === "particles") return state.cosmetics.ownedParticles;
      return [];
    }

    function setOwnList(kind, list) {
      if (kind === "theme") return { ...state.cosmetics, ownedThemes: list };
      if (kind === "frame") return { ...state.cosmetics, ownedFrames: list };
      if (kind === "particles") return { ...state.cosmetics, ownedParticles: list };
      return state.cosmetics;
    }

    function buyCosmetic(kind, id) {
      const item = findCosmetic(kind, id);
      if (!item || item.free) return;
      const ownedList = ownListFor(kind);
      if (ownedList.includes(id)) return;
      if (state.coins < item.price) {
        haptic(30);
        showToast("Not enough coins", "alert-triangle");
        return;
      }
      const newOwnList = [...ownedList, id];
      state = {
        ...state,
        coins: state.coins - item.price,
        cosmetics: setOwnList(kind, newOwnList),
      };
      state = {
        ...state,
        cosmetics: {
          ...state.cosmetics,
          equipped: { ...state.cosmetics.equipped, [kind]: id },
        },
      };
      if (kind === "theme") applyCosmeticTheme();
      onThemeOrCosmeticsChange();
      saveState(state);
      haptic([15, 30, 15]);
      playPurchase();
      showToast(`Unlocked: ${item.name}`, "sparkles");
      render();
    }

    function equipCosmetic(kind, id) {
      const ownedList = ownListFor(kind);
      if (!ownedList.includes(id)) return;
      state = {
        ...state,
        cosmetics: {
          ...state.cosmetics,
          equipped: { ...state.cosmetics.equipped, [kind]: id },
        },
      };
      if (kind === "theme") applyCosmeticTheme();
      onThemeOrCosmeticsChange();
      saveState(state);
      haptic(10);
      playDing();
      render();
    }

    /* ============================================================
       Chore actions
       ============================================================ */
    function completeChore(id) {
      const chore = state.chores.find((c) => c.id === id);
      if (!chore || chore.completedAt) return;

      haptic(20);
      ui.burstId = id;
      setTimeout(() => { if (ui.burstId === id) { ui.burstId = null; render(); } }, 1200);

      const beforeLevel = levelInfo(state.totalXp).level;
      const baseXp = state.totalXp + chore.xp;
      const levelFromChore = levelInfo(baseXp).level;

      // Sum the bonus for *every* level crossed by this single chore.
      let levelUpBonus = 0;
      if (levelFromChore > beforeLevel) {
        for (let l = beforeLevel + 1; l <= levelFromChore; l++) levelUpBonus += l * 25;
      }

      const totalXp = baseXp + levelUpBonus;
      const xpGained = chore.xp + levelUpBonus;

      const streakInfo = nextStreak(state);
      const streak = streakInfo.streak;
      const bestStreak = streakInfo.bestStreak;
      const freezeUsed = !!streakInfo.freezeUsed;
      const freezesToSpend = streakInfo.freezesToSpend || 0;

      const afterLevel = levelInfo(totalXp).level;
      const streakBonus = streak !== state.streak ? coinsForStreak(streak) : 0;
      const levelCoins = afterLevel > beforeLevel ? coinsForLevel(afterLevel) : 0;
      const choreCoins = coinsForChore(chore.xp);
      const coinsGained = choreCoins + levelCoins + streakBonus;

      const today = dayKey();
      const wasFirstToday = (state.completionsLog[today] || 0) === 0;

      const xpLog = { ...state.xpLog, [today]: (state.xpLog[today] || 0) + xpGained };
      const completionsLog = { ...state.completionsLog, [today]: (state.completionsLog[today] || 0) + 1 };
      const freezesLeft = freezeUsed ? Math.max(0, state.freezes - freezesToSpend) : state.freezes;

      const dailySnapshots = { ...(state.dailySnapshots || {}) };
      if (wasFirstToday) {
        dailySnapshots[today] = {
          streak: state.streak,
          bestStreak: state.bestStreak,
          freezes: state.freezes,
          lastCompletedDay: state.lastCompletedDay,
        };
      }

      const prevStreak = state.streak;

      const nowIso = new Date().toISOString();
      state = {
        ...state,
        totalXp,
        coins: state.coins + coinsGained,
        completedCount: state.completedCount + 1,
        lastCompletedDay: today,
        streak,
        bestStreak,
        freezes: freezesLeft,
        xpLog,
        completionsLog,
        dailySnapshots,
        chores: state.chores.map((c) => c.id === id
          ? { ...c, completedAt: nowIso, completionMeta: { xpGained, coinsGained, day: today, at: nowIso } }
          : c
        ),
      };

      if (freezeUsed) haptic([15, 30, 15]);

      const difficulty = chore.difficulty || "medium";
      if (difficulty === "easy") {
        sparkleBurst();
        playDing();
      } else if (difficulty === "medium") {
        confettiBurst();
        playDing();
      } else {
        screenShake();
        bigConfettiBurst();
        playWhoosh();
      }

      if (afterLevel > beforeLevel) {
        ui.levelUpModal = {
          level: afterLevel,
          title: levelTitle(afterLevel),
          bonusXp: levelUpBonus,
          coins: levelCoins,
        };
        fireConfetti();
        haptic([30, 60, 30, 60, 90]);
      }

      notifyMilestone({
        afterLevel, beforeLevel, levelUpBonus, levelCoins, streakBonus,
        streak, choreName: chore.name, choreXp: chore.xp,
      });

      // Streak milestone — a little extra fanfare on the big days.
      if (streak !== prevStreak) {
        const milestone = streakMilestoneVoice(streak);
        if (milestone) {
          setTimeout(() => notify(milestone.title, { body: milestone.body, tag: "chorequest-streak-milestone" }), 1200);
        }
      }

      saveState(state);
      render();

      requestAnimationFrame(() => {
        const el = document.querySelector(`.chore-card[data-chore-id="${id}"]`);
        if (el) {
          el.classList.add("just-completed");
          setTimeout(() => el.classList.remove("just-completed"), 700);
        }
      });
    }

    function undoCompleteChore(id) {
      const chore = state.chores.find((c) => c.id === id);
      if (!chore || !chore.completedAt) return;

      const meta = chore.completionMeta;
      if (!meta) {
        state = {
          ...state,
          chores: state.chores.map((c) => {
            if (c.id !== id) return c;
            const { completionMeta, ...rest } = c;
            return { ...rest, completedAt: null };
          }),
        };
        saveState(state);
        render();
        return;
      }

      const day = meta.day;

      const xpLog = { ...state.xpLog };
      const newDayXp = Math.max(0, (xpLog[day] || 0) - meta.xpGained);
      if (newDayXp > 0) xpLog[day] = newDayXp;
      else delete xpLog[day];

      const completionsLog = { ...state.completionsLog };
      const newDayCompletions = Math.max(0, (completionsLog[day] || 0) - 1);
      const dayIsEmpty = newDayCompletions === 0;
      if (dayIsEmpty) delete completionsLog[day];
      else completionsLog[day] = newDayCompletions;

      let streak = state.streak;
      let bestStreak = state.bestStreak;
      let freezes = state.freezes;
      let lastCompletedDay = state.lastCompletedDay;

      const dailySnapshots = { ...(state.dailySnapshots || {}) };
      if (dayIsEmpty) {
        const snap = dailySnapshots[day];
        if (snap) {
          streak = snap.streak;
          bestStreak = snap.bestStreak;
          freezes = snap.freezes;
          lastCompletedDay = snap.lastCompletedDay;
        }
        delete dailySnapshots[day];
      }

      state = {
        ...state,
        totalXp: Math.max(0, state.totalXp - meta.xpGained),
        coins: Math.max(0, state.coins - meta.coinsGained),
        completedCount: Math.max(0, state.completedCount - 1),
        streak,
        bestStreak,
        freezes,
        lastCompletedDay,
        xpLog,
        completionsLog,
        dailySnapshots,
        chores: state.chores.map((c) => {
          if (c.id !== id) return c;
          const { completionMeta, ...rest } = c;
          return { ...rest, completedAt: null };
        }),
      };

      ui.levelUpModal = null;

      ui.undoBurstId = id;
      setTimeout(() => { if (ui.undoBurstId === id) { ui.undoBurstId = null; render(); } }, 1100);

      saveState(state);
      haptic(15);
      showToast("Completion undone", "undo-2");
      render();
    }

    function confirmReset(onConfirm) {
      const overlay = document.createElement("div");
      overlay.className = "levelup-overlay confirm-overlay";
      overlay.setAttribute("role", "dialog");
      overlay.setAttribute("aria-modal", "true");
      overlay.innerHTML = `
        <div class="levelup-card" data-stop-propagation="true" tabindex="-1" style="padding:28px 24px;">
          <div class="levelup-content">
            <i data-lucide="alert-triangle" style="width:44px;height:44px;margin:0 auto 12px;color:var(--destructive);"></i>
            <p class="levelup-label" style="color:var(--destructive);">Reset progress</p>
            <p style="font-size:0.875rem;color:var(--muted-foreground);margin:12px 0 20px;line-height:1.5;">
              This will clear <strong>XP, level, coins, streaks, completions, badges and reward history</strong>.
              Your chores, rewards and cosmetics will stay.
            </p>
            <div class="btn-row two">
              <button type="button" class="btn-ghost" data-confirm="cancel">Cancel</button>
              <button type="button" class="btn-primary" data-confirm="ok" style="background:var(--destructive);">Reset</button>
            </div>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      document.body.classList.add("sheet-open");
      if (window.lucide) window.lucide.createIcons();

      const cleanup = () => {
        overlay.remove();
        if (!ui.addChoreOpen && !ui.levelUpModal) {
          document.body.classList.remove("sheet-open");
        }
        const resetBtn = document.querySelector('[data-action="reset-progress"]');
        try { resetBtn?.focus?.(); } catch {}
      };
      overlay.addEventListener("click", (e) => {
        if (e.target === overlay) { cleanup(); return; }
        const btn = e.target.closest("[data-confirm]");
        if (!btn) return;
        if (btn.dataset.confirm === "ok") onConfirm();
        cleanup();
      });
      overlay.addEventListener("keydown", (e) => {
        if (e.key === "Escape") { e.preventDefault(); cleanup(); }
      });
      overlay.querySelector("[data-confirm='cancel']")?.focus();
    }

    function resetProgress() {
      confirmReset(() => {
        state = {
          ...state,
          totalXp: 0,
          streak: 0,
          bestStreak: 0,
          lastCompletedDay: null,
          completedCount: 0,
          lastResetWeek: null,
          lastResetMonth: null,
          coins: 0,
          redeemed: [],
          xpLog: {},
          completionsLog: {},
          dailySnapshots: {},
          freezes: 1,
          perfectWeeks: 0,
          rewardsClaimed: 0,
          chores: state.chores.map((c) => {
            const { completionMeta, ...rest } = c;
            return { ...rest, completedAt: null };
          }),
        };

        pendingUndo = null;
        hideUndoToast();
        ui.levelUpModal = null;
        haptic([20, 40, 20]);
        saveState(state);
        showToast("Progress reset to 0", "rotate-ccw");
        render();
      });
    }

    function deleteChore(id) {
      const idx = state.chores.findIndex((c) => c.id === id);
      if (idx === -1) return;
      const chore = state.chores[idx];

      if (pendingUndo) {
        pendingUndo = null;
        hideUndoToast();
      }

      state = { ...state, chores: state.chores.filter((c) => c.id !== id) };
      pendingUndo = { type: "delete", chore, index: idx };

      saveState(state);
      haptic(15);
      playSoftDelete();
      render();

      showUndoToast(`Deleted "${chore.name}"`, 5000);
    }

    function addChore() {
      if (!choreDraft.name.trim()) return;
      const chore = {
        id: uid(),
        name: choreDraft.name.trim(),
        category: choreDraft.category,
        frequency: choreDraft.frequency,
        difficulty: choreDraft.difficulty,
        xp: Math.max(5, Number(choreDraft.xp) || 5),
        completedAt: null,
      };
      state = { ...state, chores: [chore, ...state.chores] };
      choreDraft.name = "";
      ui.addChoreOpen = false;
      saveState(state);
      haptic(15);
      showToast(`Added "${chore.name}"`, "check");
      render();
    }

    function addReward() {
      if (!ui.rewardDraft.name.trim()) return;
      const reward = {
        id: uid(),
        name: ui.rewardDraft.name.trim(),
        cost: Math.max(1, Number(ui.rewardDraft.cost) || 1),
        icon: ui.rewardDraft.icon,
      };
      state = { ...state, rewards: [...state.rewards, reward] };
      ui.rewardDraft = { name: "", cost: 20, icon: "gift" };
      ui.rewardFormOpen = false;
      saveState(state);
      render();
    }

    function deleteReward(id) {
      state = { ...state, rewards: state.rewards.filter((r) => r.id !== id) };
      saveState(state);
      render();
    }

    function redeemReward(id) {
      const reward = state.rewards.find((r) => r.id === id);
      if (!reward || state.coins < reward.cost) {
        haptic(30);
        return;
      }
      state = {
        ...state,
        coins: state.coins - reward.cost,
        rewardsClaimed: (state.rewardsClaimed || 0) + 1,
        redeemed: [
          { id: uid(), name: reward.name, cost: reward.cost, at: new Date().toISOString() },
          ...state.redeemed,
        ],
      };
      showToast(`Claimed: ${reward.name}`, "gift");
      haptic([15, 30, 15]);
      playCoin();
      saveState(state);
      render();
    }

    /* Event wiring */
    document.addEventListener("click", (e) => {
      const target = e.target.closest("[data-action]");
      const action = target?.dataset.action;

      const wasOverflowOpen = ui.overflowOpen;
      if (wasOverflowOpen && action !== "toggle-overflow") {
        ui.overflowOpen = false;
        if (!target) {
          render();
          return;
        }
      }

      if (!target) return;

      if (action === "close-add-chore" || action === "close-levelup") {
        const innerStops = e.target.closest("[data-stop-propagation]");
        const clickedX = e.target.closest(".sheet-close") || e.target.closest(".btn-primary");
        if (innerStops && !clickedX) return;
      }

      const id = target.dataset.id;

      switch (action) {
        case "set-nav-tab": {
          const next = target.dataset.navTab;
          if (ui.navTab !== next) {
            ui.navTab = next;
            ui.rewardFormOpen = false;
            ui.overflowOpen = false;
            haptic(10);
            try { window.scrollTo(0, 0); } catch {}
            render();
          }
          break;
        }
        case "toggle-overflow":
          ui.overflowOpen = !ui.overflowOpen;
          render();
          break;
        case "toggle-theme": ui.dark = !ui.dark; applyTheme(); onThemeOrCosmeticsChange(); render(); break;
        case "reset-progress": resetProgress(); break;
        case "toggle-notifications": notifActive() ? disableNotifications() : requestNotificationPermission(); break;
        case "toggle-mute":
          ui.muted = !ui.muted;
          try { localStorage.setItem(MUTE_KEY, ui.muted ? "1" : "0"); } catch {}
          if (!ui.muted) playDing();
          showToast(ui.muted ? "Sounds muted" : "Sounds on", ui.muted ? "volume-x" : "volume-2");
          render();
          break;
        case "open-add-chore": ui.addChoreOpen = true; ui.overflowOpen = false; render(); break;
        case "close-add-chore":
          ui.addChoreOpen = false;
          choreDraft.name = "";
          render();
          break;
        case "submit-chore":
          // No-op: the form's submit handler will run addChore(). Having this
          // explicit action prevents the parent overlay's close handler from firing.
          break;
        case "close-levelup":
          ui.levelUpModal = null;
          render();
          break;
        case "set-chore-tab":
          ui.choreTab = target.dataset.choreTab;
          ui.choreFilter = "all";
          render();
          break;
        case "set-filter": ui.choreFilter = target.dataset.filter; render(); break;
        case "set-shop-tab": ui.shopTab = target.dataset.shopTab; ui.rewardFormOpen = false; render(); break;
        case "complete-chore": completeChore(id); break;
        case "undo-complete-chore": undoCompleteChore(id); break;
        case "delete-chore": deleteChore(id); break;
        case "open-reward": ui.rewardFormOpen = true; render(); break;
        case "cancel-reward": ui.rewardFormOpen = false; render(); break;
        case "delete-reward": deleteReward(id); break;
        case "redeem-reward": redeemReward(id); break;
        case "pick-difficulty":
          choreDraft.difficulty = target.dataset.difficulty;
          choreDraft.xp = DIFFICULTY_XP[choreDraft.difficulty];
          render();
          break;
        case "pick-frequency": choreDraft.frequency = target.dataset.frequency; render(); break;
        case "pick-reward-icon": ui.rewardDraft.icon = target.dataset.icon; render(); break;
        case "pick-template": {
          const t = CHORE_TEMPLATES[parseInt(target.dataset.templateIndex, 10)];
          if (!t) break;
          choreDraft.name = t.name;
          choreDraft.category = t.category;
          choreDraft.difficulty = t.difficulty;
          choreDraft.xp = DIFFICULTY_XP[t.difficulty];
          haptic(10);
          render();
          setTimeout(() => {
            const el = document.getElementById("chore-name");
            if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
          }, 0);
          break;
        }
        case "buy-cosmetic": buyCosmetic(target.dataset.kind, id); break;
        case "equip-cosmetic": equipCosmetic(target.dataset.kind, id); break;
        case "export-data": exportData(); break;
        case "import-data": importData(); break;
      }
    });

    undoBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      performUndo();
    });

    document.addEventListener("input", (e) => {
      const bind = e.target.dataset?.bind;
      if (!bind) return;
      const val = e.target.type === "number" ? Number(e.target.value) : e.target.value;
      if (bind === "chore-name") choreDraft.name = val;
      else if (bind === "chore-category") choreDraft.category = val;
      else if (bind === "chore-xp") choreDraft.xp = val;
      else if (bind === "reward-name") ui.rewardDraft.name = val;
      else if (bind === "reward-cost") ui.rewardDraft.cost = val;
    });

    document.addEventListener("submit", (e) => {
      const form = e.target;
      if (!form.dataset || !form.dataset.form) return;
      e.preventDefault();
      if (form.dataset.form === "chore") addChore();
      else if (form.dataset.form === "reward") addReward();
    });

    document.addEventListener("keydown", (e) => {
      trapFocus(e);

      if (e.key === "Escape") {
        if (ui.levelUpModal) { ui.levelUpModal = null; render(); }
        else if (ui.overflowOpen) { ui.overflowOpen = false; render(); }
        else if (ui.addChoreOpen) { ui.addChoreOpen = false; choreDraft.name = ""; render(); }
      }
      if ((e.ctrlKey || e.metaKey) && e.key === "z" && pendingUndo) {
        e.preventDefault();
        performUndo();
      }
    });

    function scheduleReminders() {
      if (reminderTimer) clearInterval(reminderTimer);
      reminderTimer = setInterval(() => { maybeDailyReminder(); }, 15 * 60 * 1000);
    }

    (function init() {
      let dark = false;
      try {
        const stored = localStorage.getItem(THEME_KEY);
        if (stored === "dark") dark = true;
        else if (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches) dark = true;
      } catch {}
      ui.dark = dark;
      applyTheme();

      if (pendingResetCount > 0) {
        notifyReset(pendingResetCount);
        pendingResetCount = 0;
      }

      if (pendingPerfectWeek) {
        notifyPerfectWeek(pendingPerfectWeek);
        pendingPerfectWeek = 0;
      }

      setTimeout(maybeDailyReminder, 1500);
      scheduleReminders();

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") maybeDailyReminder();
      });

      const resumeAudio = () => {
        ensureAudioRunning();
        document.removeEventListener("pointerdown", resumeAudio);
        document.removeEventListener("keydown", resumeAudio);
      };
      document.addEventListener("pointerdown", resumeAudio);
      document.addEventListener("keydown", resumeAudio);

      /* Kick off the ambient background particles (they'll also re-seed when the
         theme or equipped cosmetics change). */
      setTimeout(startAmbientParticles, 300);

      render();
    })();
  })();
  </script>

  <!-- ===== PWA : enregistrement du Service Worker ===== -->
  <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", async () => {
      try {
        const reg = await navigator.serviceWorker.register("./service-worker.js");
        console.log("[ChoreQuest] SW enregistré :", reg.scope);

        let refreshing = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });

        reg.addEventListener("updatefound", () => {
          const newWorker = reg.installing;
          newWorker?.addEventListener("statechange", () => {
            if (
              newWorker.state === "installed" &&
              navigator.serviceWorker.controller
            ) {
              if (window.chorequest?.showUpdateToast) {
                window.chorequest.showUpdateToast(newWorker);
              }
            }
          });
        });
      } catch (e) {
        console.warn("[ChoreQuest] SW non enregistré :", e);
      }
    });
  }
  </script>
  <!-- ===== /PWA ===== -->
</body>
