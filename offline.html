<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#40a88b">
<title>Offline — Chorequest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fbf9f2; color: #1f2e2b;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; text-align: center; padding: 24px;
  }
  .wrap { max-width: 340px; }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.4rem; margin: 0 0 10px; letter-spacing: -0.02em;
  }
  p { color: #667a76; margin: 0 0 24px; line-height: 1.5; font-size: 0.9rem; }
  button {
    background: #40a88b; color: white; border: none;
    padding: 12px 24px; border-radius: 12px;
    font-size: 0.9rem; font-weight: 700; cursor: pointer;
    font-family: 'Space Grotesk', sans-serif;
    box-shadow: 0 6px 16px rgba(64, 168, 139, 0.25);
  }
  button:hover { background: #369175; }
  @media (prefers-color-scheme: dark) {
    body { background: #1c2a2a; color: #f0f5f4; }
    p { color: #94a8a5; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>📡 You're offline</h1>
    <p>Your chores are saved locally. Reconnect to sync.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
